function setPieces(m){ PIECES = PIECE_MODES.includes(m) ? m : 'slab'; G.save.pieces = PIECES; save(); resetSprites(); log('event', 'pieces', PIECES); }

// =====================================================================================================
// Сцена: фон мира, задняя стенка короба, детали, жернова, бак, стекло. Статичное печатается в фон уровня (bgClean);
// пятна сока ложатся на его копию (bgDirty), которую раз в 0,4 с подмывает чистый фон — пятна бледнеют.
// =====================================================================================================
const bgClean = document.createElement('canvas'), bgDirty = document.createElement('canvas');
let wallClip = null;   // задняя стенка без деталей: пятна сока ложатся только на неё
function vbase(c, sx, sy){ c.setTransform(K, 0, 0, K, DPR * view.ox + (sx || 0) * K, DPR * view.oy + (sy || 0) * K); }
// Фон мира вокруг короба: градиент и крупные мягкие круги.
function drawWorld(c, th){
  const w = c.canvas.width, h = c.canvas.height;
  c.setTransform(1, 0, 0, 1, 0, 0);
  const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, th.world); gr.addColorStop(1, th.world2);
  c.fillStyle = gr; c.fillRect(0, 0, w, h);
  const r = mulberry32(31); c.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 9; i++){ c.beginPath(); c.arc(r() * w, r() * h, (0.08 + 0.12 * r()) * w, 0, 6.29); c.fill(); }
}
// Задняя стенка короба: градиент, узор точками, глубина у стенок и над жерновами.
function drawBackWall(c, th){
  const gy = CFG.grindY, W = CFG.W, top = VIEW.top, fy = CFG.floorY;
  const gr = c.createLinearGradient(0, top, 0, gy); gr.addColorStop(0, th.wall); gr.addColorStop(1, th.wall2);
  c.fillStyle = gr; c.fillRect(0, top, W, gy - top);
  c.fillStyle = th.wallDot;
  for (let j = 0, y = 12; y < gy; y += 24, j++) for (let x = j % 2 ? 12 : 0; x <= W; x += 24){ c.beginPath(); c.arc(x, y, 3, 0, 6.29); c.fill(); }
  for (const [x0, x1] of [[0, 30], [W, W - 30]]){ const g2 = c.createLinearGradient(x0, 0, x1, 0); g2.addColorStop(0, 'rgba(43,33,64,0.16)'); g2.addColorStop(1, 'rgba(43,33,64,0)');
    c.fillStyle = g2; c.fillRect(Math.min(x0, x1), top, 30, gy - top); }
  // v2: зона полёта под бункерами — глубже и темнее к жерновам, мерные риски на стекле (видно, как далеко летит кусок)
  const g3 = c.createLinearGradient(0, fy, 0, gy); g3.addColorStop(0, 'rgba(43,33,64,0.04)'); g3.addColorStop(1, 'rgba(43,33,64,0.3)');
  c.fillStyle = g3; c.fillRect(0, fy, W, gy - fy);
  c.strokeStyle = 'rgba(43,33,64,0.13)'; c.lineWidth = 1.5;
  for (let y = fy + 30; y < gy - 10; y += 30){ c.beginPath(); c.moveTo(8, y); c.lineTo(20, y); c.moveTo(W - 8, y); c.lineTo(W - 20, y); c.stroke(); }
}
// Деталь короба: пластик темы, свет ступенями по рёбрам, тень на стенке, болты, чернильный контур. Штырь — хромированный.
function drawPart(c, st, th){
  const P = st.poly, ink = VIEW.ink, L = VIEW.light;
  let cx = 0, cy = 0; for (const v of P){ cx += v[0]; cy += v[1]; } cx /= P.length; cy /= P.length;
  c.fillStyle = 'rgba(43,33,64,0.2)'; pathPoly(c, P.map(v => [v[0] + 5, v[1] + 7])); c.fill();
  if (st.role === 'peg'){
    let r = 0; for (const v of P) r = Math.max(r, Math.hypot(v[0] - cx, v[1] - cy));
    c.beginPath(); c.arc(cx, cy, r, 0, 6.29); c.fillStyle = th.metal; c.fill();
    c.beginPath(); c.arc(cx + 1.5, cy + 1.5, r * 0.75, 0, 6.29); c.fillStyle = th.metalDark; c.globalAlpha = 0.35; c.fill(); c.globalAlpha = 1;
    c.beginPath(); c.arc(cx - r * 0.35, cy - r * 0.35, r * 0.28, 0, 6.29); c.fillStyle = '#fff'; c.fill();
    c.beginPath(); c.arc(cx, cy, r, 0, 6.29); c.lineWidth = 2.4; c.strokeStyle = ink; c.stroke();
    return;
  }
  c.fillStyle = th.part; pathPoly(c, P); c.fill();
  c.save(); pathPoly(c, P); c.clip();
  for (let i = 0; i < P.length; i++){
    const a = P[i], b = P[(i + 1) % P.length], ex = b[0] - a[0], ey = b[1] - a[1], Ln = Math.hypot(ex, ey); if (Ln < 2) continue;
    let nx = -ey / Ln, ny = ex / Ln; if ((cx - a[0]) * nx + (cy - a[1]) * ny < 0){ nx = -nx; ny = -ny; }   // n — внутрь
    const lit = -(nx * L[0] + ny * L[1]);                       // ребро смотрит на свет
    if (Math.abs(lit) < 0.25) continue;
    const w = lit > 0 ? 6 : 8;
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(b[0] + nx * w, b[1] + ny * w); c.lineTo(a[0] + nx * w, a[1] + ny * w); c.closePath();
    c.fillStyle = lit > 0 ? th.partLight : th.partDark; c.fill();
  }

  c.lineJoin = 'round'; c.lineWidth = 2.6; c.strokeStyle = ink; pathPoly(c, P); c.stroke();

    bolts.push([cx + (far[0] - cx) * 0.5, cy + (far[1] - cy) * 0.5]); }
  for (const [x, y] of bolts){
    if (polyDist(P, x, y) > 0 || y > CFG.grindY - 6) continue;
    c.beginPath(); c.arc(x, y, 3.8, 0, 6.29); c.fillStyle = th.bolt; c.fill(); c.lineWidth = 1.5; c.strokeStyle = ink; c.stroke();
    c.beginPath(); c.moveTo(x - 2.2, y - 1); c.lineTo(x + 2.2, y + 1); c.lineWidth = 1.2; c.stroke();
  }
}
// Обод короба сверху: металлическая губа с болтами.
function drawRim(c, th){
  const y = VIEW.top, W = CFG.W;
  c.fillStyle = th.metal; c.fillRect(-6, y, W + 12, 12);
  c.fillStyle = '#ffffff'; c.globalAlpha = 0.7; c.fillRect(-6, y + 2.5, W + 12, 2); c.globalAlpha = 1;
  c.fillStyle = th.metalDark; c.fillRect(-6, y + 9, W + 12, 3);
  c.lineWidth = 2.2; c.strokeStyle = VIEW.ink; c.strokeRect(-6, y, W + 12, 12);
  for (const x of [16, W - 16]){ c.beginPath(); c.arc(x, y + 6, 3, 0, 6.29); c.fillStyle = th.bolt; c.fill(); c.lineWidth = 1.3; c.stroke(); }
}
// Полость жерновов (за валиками) и задняя стенка бака.
function drawMachineBack(c, th){
  const gy = CFG.grindY, [x0, y0, x1, y1] = VIEW.tank;
  c.fillStyle = '#251b3d'; c.fillRect(0, gy, CFG.W, 44);
  c.fillStyle = th.metalDark; c.fillRect(-6, gy + 42, CFG.W + 12, y1 - gy - 38);
  // v2: бак — светлая стеклянная банка: светлое стекло, мерная шкала
  const gr = c.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, '#eef6ff'); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, '#dfe9f7');
  c.beginPath(); roundRect(c, x0, y0, x1 - x0, y1 - y0, 14); c.fillStyle = gr; c.fill();
  c.strokeStyle = 'rgba(43,33,64,0.18)'; c.lineWidth = 1.2;

}
function roundRect(c, x, y, w, h, r){ c.moveTo(x + r, y);   // подпуть без beginPath: можно собирать несколько в один путь
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function buildBackground(){
  if (!cv.width) return;

  const c = ctx2d(bgClean), th = theme();
  if (isV4() && ART_STYLE === 'sticker'){                     // v5 «наклейка»: рисованная стенка с узором, детали пластиком темы с контуром

    c.strokeStyle = 'rgba(200,150,110,0.25)'; c.lineWidth = 1.5; c.beginPath(); for (let y = CFG.grindY + 64; y < CFG.grindY + 440; y += 26){ c.moveTo(-40, y); c.lineTo(CFG.W + 40, y); }
    for (let y = CFG.grindY + 38, r = 0; y < CFG.grindY + 440; y += 26, r++) for (let x = (r % 2) * 20 - 40; x < CFG.W + 40; x += 40){ c.moveTo(x, y); c.lineTo(x, y + 26); } c.stroke();

    const t9 = toy9();                                        // v9: toy (clear) — спокойный фон, тёмный корпус жерновов вместо стойки, горло щелей, синие опоры, светлый обод

    if (t9) drawGapThroats9(c, G.s);

  if (G.s) for (const st of G.s.statics) if (st.role !== 'wall'){ drawPart(c, st, th); st.poly.forEach((v, i) => i ? wallClip.lineTo(v[0], v[1]) : wallClip.moveTo(v[0], v[1])); wallClip.closePath(); }

// ------------------------------------------------------------------ сцена v4 (режим заказа): иллюстрация бара в расфокусе,
// стеклянная витрина над жерновами, детали — дерево (спрайт доски), хром (прутья решётки), джут (верёвки), ветка, крюки.
const isV4 = () => !!G.s && (G.s.mode === 'order' || G.s.mode === 'clear');
let woodPat = null;
function woodPattern(c){

  for (let i = 0; i < opt.frames; i++){ const t0 = performance.now(); render(); flush(); rt.push(performance.now() - t0); }
  const cpu = [], fl = [];
  for (let i = 0; i < 60; i++){ const t0 = performance.now(); render(); cpu.push(performance.now() - t0); flush(); }
  for (let i = 0; i < 60; i++){ ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillRect(0, 0, 1, 1); const t0 = performance.now(); flush(); fl.push(performance.now() - t0); }
  for (let i = 0; i < 30; i++){ frameStep(1 / 60); render(); flush(); }   // каждый кадр растеризуется, как при показе
  let best = null, bestN = -1;
  for (let y = 200; y <= 560; y += 20) for (const a of [0, 0.4, -0.4]){
    const L = CFG.bladeMax / 2, line = [200 - Math.cos(a) * L, y - Math.sin(a) * L, 200 + Math.cos(a) * L, y + Math.sin(a) * L];
    const c = previewCut(s, ...line).length; if (c > bestN){ bestN = c; best = line; }
  }
  const b0 = bakeCount, t0 = performance.now();
  doCut(...best); frameStep(1 / 60); render(); flush();
  const cutMs = performance.now() - t0, cutBakes = bakeCount - b0, after = [];
  let peakP = 0;
  for (let i = 0; i < 60; i++){ const t1 = performance.now(); frameStep(1 / 60); render(); flush(); after.push(performance.now() - t1); peakP = Math.max(peakP, PT.n); }
  const out = { bodies: n, cssW: Math.round(view.w), cssH: Math.round(view.h), dpr: DPR, canvas: cv.width + '×' + cv.height,
    renderMedian: pct(rt, 0.5), renderP95: pct(rt, 0.95), renderMax: pct(rt, 1), long16: +(rt.filter(v => v > 16.7).length / rt.length).toFixed(3),
    cpuMedian: pct(cpu, 0.5), flushMedian: pct(fl, 0.5),
    cutBodies: bestN, cutBakes, cutFrame: +cutMs.toFixed(2), afterMedian: pct(after, 0.5), afterMax: pct(after, 1), after33: after.filter(v => v > 33).length, peakParticles: peakP };
  log('event', 'bench', JSON.stringify(out));
  return out;
}

// Живой замер не читает холст (getImageData перевёл бы его на CPU) — гонять на свежей странице без ?cpu.
function liveBench(sec){
  const s = benchPile({ level: 23, target: 150 }), iv = [], work = [], cutAt = { i: -1 };
  let last = performance.now(), t0 = last, phase = 0;
  const q = (a, f) => { const b = a.slice().sort((x, y) => x - y); return +b[Math.min(b.length - 1, Math.floor(f * b.length))].toFixed(2); };
  return new Promise((done) => {
    const origTick = tick;
    function f(){
      const now = performance.now(); iv.push(now - last); last = now;
      const w0 = performance.now(); origTick(); work.push(performance.now() - w0);
      if (phase === 0 && now - t0 > sec * 1000){ phase = 1; cutAt.i = iv.length;
        let best = null, bn = -1;
        for (let y = 200; y <= 560; y += 20) for (const a of [0, 0.4, -0.4]){ const L = CFG.bladeMax / 2, line = [200 - Math.cos(a) * L, y - Math.sin(a) * L, 200 + Math.cos(a) * L, y + Math.sin(a) * L];
          const c = previewCut(s, ...line).length; if (c > bn){ bn = c; best = line; } }
        doCut(...best); }
      if (phase === 1 && now - t0 > 2 * sec * 1000){
        const idle = iv.slice(5, cutAt.i), act = iv.slice(cutAt.i), wi = work.slice(5, cutAt.i), wa = work.slice(cutAt.i);
        done({ frames: iv.length, idleIntervalMedian: q(idle, 0.5), idleOver20: idle.filter(v => v > 20).length, idleWorkMedian: q(wi, 0.5),
          actIntervalMedian: q(act, 0.5), actIntervalMax: q(act, 1), actOver33: act.filter(v => v > 33.4).length, actWorkMedian: q(wa, 0.5), actWorkMax: q(wa, 1),
          cutFrameWork: +work[cutAt.i].toFixed(2), cutFrameInterval: +(iv[cutAt.i + 1] || 0).toFixed(2) });
        G.liveBench = false; return; }
      requestAnimationFrame(f);
    }
    G.liveBench = true; requestAnimationFrame(f);
  });
}

// v6: живой замер автоигрой знающего (уровни from…to подряд; после подачи игра сама идёт дальше). Останавливается на уровне за to,
// на проигрыше или по maxSec. → { frames, ivMed, ivMax, over33, workMed, workP95, workMax, per: { уровень: served|lost }, liqMax }.
function liveAuto(from, to, maxSec){
  G.paused = false; setUnlockAll(true); startLevel(from); G.auto = 'know';
  const q = (a, f) => { const b = a.slice().sort((x, y) => x - y); return b.length ? +b[Math.min(b.length - 1, Math.floor(f * b.length))].toFixed(2) : 0; };
  let last = performance.now(); const t0 = last, iv = [], work = [], per = {}, worst = []; let liqMax = 0, ptMax = 0;
  return new Promise((done) => {
    function f(){
      const now = performance.now(); iv.push(now - last); last = now; const w0 = performance.now(); tick(); const wk = performance.now() - w0; work.push(wk);
      if (wk > 12){ const s0 = G.s; worst.push({ ms: +wk.toFixed(1), n: s0 && s0.n, t: s0 && +s0.t.toFixed(2), screen: G.screen, flight: s0 && s0.flight ? s0.flight.w : '', bodies: s0 && s0.bodies.length, intro: G.rt < G.introUntil }); }
      liqMax = Math.max(liqMax, LIQ.n); ptMax = Math.max(ptMax, PT.n);
      const s = G.s; if (s){ if (!per[s.n]) per[s.n] = 'play'; if (s.served || (s.mode === 'clear' && s.won)) per[s.n] = 'won'; if (s.lost) per[s.n] = 'lost'; }
      if ((s && s.n > to) || now - t0 > maxSec * 1000 || (s && s.lost && G.screen === 'lose')){
        G.liveBench = false; G.auto = ''; const v = iv.slice(5), w = work.slice(5);
        done({ frames: v.length, sec: +((now - t0) / 1000).toFixed(1), ivMed: q(v, 0.5), ivMax: q(v, 1), over20: v.filter(x => x > 20).length, over33: v.filter(x => x > 33.4).length,
          workMed: q(w, 0.5), workP95: q(w, 0.95), workMax: q(w, 1), per, liqMax, ptMax, worst: worst.slice(0, 12) }); return; }
      requestAnimationFrame(f);
    }
    G.liveBench = true; requestAnimationFrame(f);
  });
}

// v12: живой замер стенда 3D. Свежая страница #lab3d, после r3ready(): броски по расписанию (с от старта), цель — самый крупный кусок арбуза.
function live3(sec){
  G.paused = false; startLab3();
  const q = (a, f) => { const b = a.slice().sort((x, y) => x - y); return b.length ? +b[Math.min(b.length - 1, Math.floor(f * b.length))].toFixed(2) : 0; };
  const plan = [[0.8, 'mace'], [2.6, 'saw'], [4.4, 'axe'], [6.2, 'knife']], hits = [];
  let last = performance.now(); const t0 = last, iv = [], work = [], worst = []; let k = 0, trisMace = 0, maxTris = 0;   // круг 3: треугольники в кадре после булавы
  return new Promise((done) => {
    function f(){
      const now = performance.now(); iv.push(now - last); last = now;
      if (k < plan.length && now - t0 > plan[k][0] * 1000 && !G.s.flight){ const w = plan[k][1], B = G.s.bodies.filter(b => b.kind === 'melon').sort((a, b) => b.area - a.area)[0] || G.s.bodies[0];
        const r = B.rad, x = B.x, y = B.y, pts = w === 'knife' ? [[x - 9, y - r - 40], [x + 9, y + r + 12]] : w === 'saw' ? [[x + 6, y - r - 40], [x - 6, y + r + 10]] : w === 'axe' ? [[x - r - 70, y - r - 70], [x, y]] : [[x + 4, y - r - 90], [x, y]];
        if (k === 1) trisMace = R3.stats.tris;
        pickWeapon(G.s, w); const rr = throwWeapon(G.s, w, pts); pump(); hits.push({ w, at: iv.length, spent: rr.spent }); k++; }
      const w0 = performance.now(); tick(); const wk = performance.now() - w0; work.push(wk); maxTris = Math.max(maxTris, R3.stats.tris || 0);
      if (wk > 8) worst.push({ ms: +wk.toFixed(1), i: iv.length, t: +((now - t0) / 1000).toFixed(2), bodies: G.s.bodies.length, built: R3.stats.built, render: R3.stats.renderMs, r3: R3.stats.frameMs });
      if (now - t0 > sec * 1000){ G.liveBench = false; const v = iv.slice(3), w = work.slice(3);
        done({ frames: v.length, ivMed: q(v, 0.5), ivP95: q(v, 0.95), ivMax: q(v, 1), over20: v.filter(x => x > 20).length, over33: v.filter(x => x > 33.4).length,
          workMed: q(w, 0.5), workP95: q(w, 0.95), workMax: q(w, 1), hits, worst: worst.slice(0, 12), bodies: G.s.bodies.length, mode: R3.mode, tripo: !!R3.tready, trisMace, maxTris, r3: Object.assign({}, R3.stats) }); return; }
      requestAnimationFrame(f);
    }
    G.liveBench = true; requestAnimationFrame(f);
  });
}

// --- старт ---
fit(); hud(); liqInit();
if (document.fonts && document.fonts.load) document.fonts.load('700 20px ' + FONT).then(() => { buildBackground(); log('event', 'font', FONT); }).catch(() => {});
// v2: режим лезвия хешем — #aim (прицел v1, сразу в игру) или #direct; иначе — из сейва (меню «Blade»), по умолчанию CFG.bladeMode
function setBlade(mode){ CFG.bladeMode = mode === 'aim' ? 'aim' : 'direct'; G.save.blade = CFG.bladeMode; save(); G.aim = null; log('event', 'blade', CFG.bladeMode); }
if (G.save.blade === 'aim' || G.save.blade === 'direct') CFG.bladeMode = G.save.blade;
if (!G.save.v7){ G.save.v7 = 1; G.save.goal = 'clear'; save(); }   // v7: старый сейв (v6) — один раз переключить на «развали»
if (G.save.goal === 'tank' || G.save.goal === 'order' || G.save.goal === 'clear') CFG.goalMode = G.save.goal;
if (G.save.oset === 'v3' || G.save.oset === 'v4' || G.save.oset === 'v5') CFG.orderSet = G.save.oset;   // набор уровней заказа из сейва (меню «Levels»), по умолчанию — v5
if (STYLES.includes(G.save.style)) ART_STYLE = G.save.style;                    // v5: набор арта из сейва (меню «Art»)
if (PIECE_MODES.includes(G.save.pieces)) PIECES = G.save.pieces;                // v8: вид кусков из сейва (#pieces=)
let startHash = location.hash.slice(1) === 'unlock' ? (setUnlockAll(true), 'menu') : location.hash.slice(1);
// v12, этап 2: вид линейки v11 — 3D Tripo по умолчанию; #2d / #3d и пункт меню «View» меняют и помнят выбор (сейв view)
function setView3d(on){ G.view3d = !!on; G.save.view = G.view3d ? '3d' : '2d'; save(); log('event', 'view', G.save.view); if (G.view3d && r3Game()) r3Load(); }
G.view3d = G.save.view !== '2d';
if (startHash === '2d' || startHash === '3d'){ setView3d(startHash === '3d'); if (CFG.goalMode !== 'clear') setGoalMode('clear'); CFG.clearSet = 'v11'; startHash = 'game'; }
// v10: юзер-тест — текущая игра («развали уровень», набор toy) сразу с уровня из сейва, без меню (хеши режимов игнорируются)
function setUserTest(){ CFG.userTest = true; document.body.classList.add('ut'); if (CFG.goalMode !== 'clear') setGoalMode('clear'); if (ART_STYLE !== 'toy'){ ART_STYLE = 'toy'; resetSprites(); woodPat = null; if (G.s){ applyTheme(); buildBackground(); } } log('event', 'userTest', 'on'); }
if (CFG.userTest){ setUserTest(); startHash = 'game'; }
if (startHash === 'aim' || startHash === 'direct'){ setBlade(startHash); if (CFG.orderSet === 'v6') setOrderSet('v5'); startHash = 'game'; }   // v6: #direct — прежний взмах (уровни v5)
if (startHash === 'tank' || startHash === 'order'){ setGoalMode(startHash); startHash = 'game'; }
if (startHash === 'v3' || startHash === 'v4' || startHash === 'v5' || startHash === 'v6'){ setGoalMode('order'); setOrderSet(startHash); startHash = 'game'; }
if (startHash === 'v7' || startHash === 'v11'){ setGoalMode('clear'); CFG.clearSet = 'v11'; startHash = 'game'; }
if (startHash === 'v7old'){ setGoalMode('clear'); CFG.clearSet = 'v7'; startHash = 'game'; }   // v11: прежние 12 уровней v7 (набор ×2)
if (startHash.startsWith('pieces=')){ setPieces(startHash.slice(7)); startHash = 'game'; }   // v8: #pieces=slab|band
let labBoot = false; if (startHash === 'cutlab'){ setGoalMode('clear'); labBoot = true; startHash = 'game'; }
let lab3Boot = false; if (startHash === 'lab3d'){ setGoalMode('clear'); lab3Boot = true; startHash = 'game'; }   // v12: стенд 3D
if (startHash.startsWith('style=')){ ART_STYLE = STYLES.includes(startHash.slice(6)) ? startHash.slice(6) : 'toy'; G.save.style = ART_STYLE; save(); if (CFG.goalMode !== 'order') setGoalMode('order'); startHash = 'game'; }
if (startHash === 'game') startLevel(curLevel());
else if (startHash === 'win' || startHash === 'lose'){ startLevel(curLevel()); goto(startHash); }
else goto(startHash || 'menu');
if (labBoot) startLab();
if (lab3Boot) startLab3();
loadAssets(); ASSETS.onReady.push(() => { resetSprites(); woodPat = null; buildBackground(); });   // v4: спрайты GPT и фон
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length + '+gen planck=1.4.2');
</script>
