<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulp Drop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#281c45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>

@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:block;src:url('vendor/fredoka-latin.woff2') format('woff2')}
/* Палитра интерфейса. Цвета мира (--world, --world2) оболочка переписывает из THEMES при старте уровня. */
:root{
  --world:#3d2c63; --world2:#281c45; --ink:#2b2140; --text:#ffffff; --muted:#bfb2e3;
  --good:#3cc65a; --good-d:#1f8a36; --bad:#ef4444; --bad-d:#a62020; --accent:#ffb21f; --accent-d:#c98000;
  --card:#fff8ee; --card-ink:#2b2140; --card-muted:#7d6f9e; --pill:#fffdf8;
  --frame-w:430px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--world2);color:var(--text);font:500 16px/1.25 'Fredoka', system-ui, sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:var(--world);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#game{position:absolute;inset:0;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#game canvas#gl{pointer-events:none}   /* v5: слой жидкого сока (WebGL) поверх поля */
/* HUD поверх холста: уровень, ходы с ножом, звук, меню. Слой pointer-events:none, кнопки — auto (§9). */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;display:flex;align-items:center;
  justify-content:space-between;gap:8px;pointer-events:none;z-index:2}
.pill{display:flex;align-items:center;gap:6px;background:var(--pill);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;
  padding:3px 12px 3px 10px;box-shadow:0 3px 0 var(--ink);font-weight:700;line-height:1}
.pill.lvl{font-size:15px;min-width:92px}
.pill.lvl span{font-size:11px;letter-spacing:.06em;color:var(--card-muted)}
.pill.moves{font-size:24px;padding:3px 14px 3px 8px}
.pill.moves svg{width:30px;height:30px;display:block}
.pill.moves.low{background:#ffe1e1}
.bump{animation:bump .32s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}  /* стартует с видимого состояния (§9) */
.hud-r{display:flex;gap:6px}
.ico{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);background:var(--pill);padding:0;
  box-shadow:0 3px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ico svg{width:24px;height:24px;display:block}
.ico:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
/* Кнопки объёмные: тень снизу, проседают при нажатии; хорошее — зелёным, нежелательное — красным. */
button{font:inherit;cursor:pointer}
.btn{display:inline-block;font-weight:700;font-size:20px;line-height:1;color:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:14px 26px;
  background:linear-gradient(#5ad874,var(--good) 55%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 1px 0 var(--ink)}
.btn.big{font-size:24px;padding:16px 30px;min-width:220px}
.btn.amber{background:linear-gradient(#ffd060,var(--accent) 55%);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.plain{background:linear-gradient(#ffffff,#ece6f8 60%);color:var(--ink);text-shadow:none;font-size:17px;padding:11px 18px}
.btn.bad{background:linear-gradient(#ff6b6b,var(--bad) 60%);font-size:14px;padding:8px 14px;border-radius:12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 3px 0 var(--ink)}
.btn.bad:active{box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 0 0 var(--ink)}
.btn svg{width:22px;height:22px;vertical-align:-4px;margin-right:6px}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(32,22,58,.55);padding:20px;z-index:3}
#overlay.show{display:flex}
.card{background:var(--card);color:var(--card-ink);border:3px solid var(--ink);border-radius:26px;padding:22px 20px 20px;max-width:350px;width:100%;
  text-align:center;box-shadow:0 7px 0 var(--ink);animation:pop .22s ease-out}   /* стартует с видимого состояния (§9) */
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.card h2{margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:.01em}
.card h1{margin:0;font-size:44px;font-weight:700;color:var(--accent);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;
  text-shadow:0 4px 0 var(--ink);letter-spacing:.02em}
.card p{color:var(--card-muted);margin:4px 0 14px;font-size:16px}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 8px;max-height:36vh;overflow-y:auto;padding:4px}
.levels button{padding:9px 0;font-size:15px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:0 2px 0 var(--ink)}
.levels button.locked{opacity:.4} .levels button.cur{background:var(--accent)}
.cheat{margin-top:10px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--card-muted);color:var(--card-muted);border-radius:10px}
.short-ico{position:relative;width:96px;height:96px;margin:0 auto 4px}
.short-ico img{width:96px;height:96px;display:block}
.short-drop{position:absolute;right:-18px;bottom:-4px;width:40px;height:40px}
/* v6: лоток оружия — кнопка на каждое оружие набора: значок и число; выбранное приподнято и зелёное, пустое гаснет. */
#tray{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;gap:10px;z-index:2;pointer-events:none}
#tray.hide,.hide6{display:none!important}
.wpn{pointer-events:auto;position:relative;width:76px;height:58px;border-radius:16px;border:2.5px solid var(--ink);background:var(--pill);box-shadow:0 4px 0 var(--ink);
  padding:0;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.wpn img{width:62px;height:42px;object-fit:contain;transform:rotate(-28deg);pointer-events:none}
.wpn b{position:absolute;right:-8px;top:-9px;min-width:26px;height:26px;border-radius:13px;background:#fff;border:2.5px solid var(--ink);font-size:15px;line-height:21px;color:var(--ink);padding:0 5px}
.wpn.sel{background:#dfffd9;border-color:var(--good-d);transform:translateY(-5px);box-shadow:0 9px 0 var(--ink)}
.wpn.sel b{background:var(--good);color:#fff}
.wpn.empty{opacity:.38;filter:grayscale(1);box-shadow:0 2px 0 var(--ink)}
.wpn.empty b{background:#eee}
/* v7: сколько кучи осталось — полоса тает до нуля */
.pill.heap{padding:4px 10px 4px 6px;gap:6px}
.pill.heap svg{width:26px;height:26px;display:block}
.hb{position:relative;display:block;width:122px;height:16px;border-radius:9px;background:#efe6da;border:2px solid var(--ink);overflow:hidden}
.hb i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#ffb09a,#ff6b5b 55%,#e2453f);border-radius:0 7px 7px 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;
  border-radius:12px;pointer-events:none;opacity:.96;transition:opacity .25s;white-space:nowrap;z-index:4}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card,.bump{animation:none} #toast{transition:none} }
</style>

<script>
'use strict';
/* ЯДРО */
// =====================================================================================================
// Pulp Drop — ядро. Взмах режет кучу фруктов, куски падают в жернова, сок наполняет бак.
// Физика — planck.js 1.4.2 (порт Box2D), vendor/planck.js: в браузере глобальный `planck`, в node его подаёт
// core-load.mjs. Ядро без DOM и без Math.random (в planck Math.random есть только в утилите math.random,
// на пути симуляции её нет — проверяет test.mjs). Случайность — mulberry32 с сидом от номера уровня.
// Координаты — виртуальные единицы: ширина поля CFG.W = 400, ось y вниз. В planck — метры (делим на CFG.ppm).
// Формат уровня и событий открыт для особых предметов этапа 3 (бомба, скорлупа, верёвка, вертушка):
// у предмета кучи есть поле tag (flags.tag тела), у детали — свой тип в parts; события explode / crack / rope
// зарезервированы (см. drainEvents).
// =====================================================================================================

const CFG = {
  // --- поле (виртуальные единицы, y вниз) ---
  W: 400,               // ширина поля
  H: 800,               // высота видимого поля (бункеры, зона полёта, жернова; бак — ниже)
  floorY: 610,          // v2: низ бункеров — опора кучи. Под ним пустая зона полёта до жерновов
  grindY: 770,          // v2: линия жерновов во всю ширину: от низа висящей пробки (floorY + plugHang) до неё ≥ 130 ед. полёта
  slotH: 24,            // глубина щели в бункере по умолчанию (у детали может быть своя): пробка сидит в щели,
                        // её низ на plugClear выше низа бункера
  plugClear: 5,         // v1: зазор между низом пробки и линией жерновов (v2 не использует — см. plugHang)
  plugHang: 20,         // v2: пробка висит в щели и торчит ниже бункера на столько ед. — снизу видно, что резать,
                        // срезанный «низ» падает сразу (как в жанре)
  wallT: 40,            // толщина стенок короба снаружи поля: толстые, чтобы щепки не пролетали
  wallTop: -500,        // верх стенок — выше видимого поля
  pileTop: 40,          // при раскладке кучи предметы не выше этой линии
  placeStep: 4,         // шаг перебора x при раскладке кучи
  placeGap: 0.8,        // зазор между предметами при раскладке (дальше доосадка)
  // --- физика (planck) ---
  ppm: 30,              // виртуальных единиц в метре planck: тела 0,6–4 м — рабочий диапазон Box2D
  gravity: 46,          // м/с² (v2; v1 — 28): кусок пролетает зону жерновов (≈ 150 ед.) за ≈ 0,35 с — резко, как в жанре
  dt: 1 / 120,          // фиксированный шаг (PROTO-BASE §4)
  velIters: 8,          // итерации скорости решателя
  posIters: 4,          // итерации позиции решателя
  friction: 0.3,        // трение целых фруктов: угол сползания ≈ 17°, клинья воронки круче (≈ 35–44°)
  pieceFriction: 0.02,  // трение кусков (v2; v1 — 0,1): мокрая мякоть скользит по всему (смесь трений в planck — среднее геометрическое)
  partFriction: 0.2,    // трение статичных деталей (v2; v1 — 0,35): клинья круче 37°, целые фрукты по ним всё равно не ползут
  wallFriction: 0.05,   // трение стеклянных стенок короба: куски у стенки съезжают, а не висят
  restitution: 0.05,    // упругость: фрукты почти не отскакивают
  maxSpeed: 1000,       // предохранитель скорости тел, ед./с (этап 3: взрыв у лопасти вертушки разгонял кусок до вылета)
  linDamp: 0.05,        // линейное затухание
  angDamp: 0.6,         // угловое затухание: гасит дрожь и вечное катание
  // --- рез ---

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------------ геометрия выпуклых многоугольников
// Вершины — массивы [x, y]; обход с положительной площадью по формуле шнурков (в осях y-вниз).
function polyArea(V){
  let s = 0;
  for (let i = 0, n = V.length; i < n; i++){ const p = V[i], q = V[(i + 1) % n]; s += p[0] * q[1] - q[0] * p[1]; }
  return s / 2;
}
function polyCentroid(V){
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = V.length; i < n; i++){
    const p = V[i], q = V[(i + 1) % n], cr = p[0] * q[1] - q[0] * p[1];
    a += cr; cx += (p[0] + q[0]) * cr; cy += (p[1] + q[1]) * cr;
  }
  a /= 2;
  return Math.abs(a) < 1e-12 ? [V[0][0], V[0][1]] : [cx / (6 * a), cy / (6 * a)];
}
function polyRadius(V){ let r = 0; for (const v of V) r = Math.max(r, Math.hypot(v[0], v[1])); return r; }
// Толщина: наименьшая по рёбрам «высота» многоугольника над ребром. Щепка тоньше CFG.minThick — брызги.
function polyThick(V){
  let best = Infinity;
  for (let i = 0, n = V.length; i < n; i++){
    const p = V[i], q = V[(i + 1) % n], ex = q[0] - p[0], ey = q[1] - p[1], L = Math.hypot(ex, ey);
    if (L < 1e-9) continue;
    let h = 0;
    for (const v of V){ const d = Math.abs((v[0] - p[0]) * ey - (v[1] - p[1]) * ex) / L; if (d > h) h = d; }
    if (h < best) best = h;
  }
  return best;
}
// Выпуклая оболочка (монотонная цепь), обход с положительной площадью.
function convexHull(P){
  const pts = P.map(p => [p[0], p[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts){ while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--){ const p = pts[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  up.pop(); lo.pop();
  const h = lo.concat(up);
  return polyArea(h) < 0 ? h.reverse() : h;
}
// Пересечение отрезка a→b с выпуклым многоугольником: параметры входа и выхода [t0, t1] по прямой (без обрезки
// по [0,1]) или null. «Насквозь» — когда 0 < t0 < t1 < 1: оба конца лезвия снаружи тела.
function clipChord(V, ax, ay, bx, by){
  const n = V.length, dx = bx - ax, dy = by - ay, sg = polyArea(V) >= 0 ? 1 : -1;
  let t0 = -Infinity, t1 = Infinity;
  for (let i = 0; i < n; i++){
    const p = V[i], q = V[(i + 1) % n], ex = q[0] - p[0], ey = q[1] - p[1];
    const nx = sg * ey, ny = -sg * ex;                          // наружная нормаль ребра
    const num = nx * (p[0] - ax) + ny * (p[1] - ay), den = nx * dx + ny * dy;
    if (den === 0){ if (num < 0) return null; continue; }
    const t = num / den;
    if (den < 0){ if (t > t0) t0 = t; } else if (t < t1) t1 = t;
    if (t0 > t1) return null;
  }
  return [t0, t1];
}
// Разрез многоугольника прямой (точка p, нормаль n). F[i] — ребро i→i+1 является срезом.
// Возвращает { A, B }: A — сторона d ≥ 0, B — d < 0; каждая { V, F } или null. Новые рёбра по линии — срезы.
function splitPoly(V, F, px, py, nx, ny){
  const n = V.length, d = new Array(n);
  for (let i = 0; i < n; i++) d[i] = (V[i][0] - px) * nx + (V[i][1] - py) * ny;
  const A = [], AF = [], B = [], BF = [];
  for (let i = 0; i < n; i++){
    const j = (i + 1) % n, vi = V[i], vj = V[j], di = d[i], dj = d[j];
    if (di >= 0){ A.push(vi); AF.push(F[i]); } else { B.push(vi); BF.push(F[i]); }
    if ((di >= 0) !== (dj >= 0)){
      const t = di / (di - dj), I = [vi[0] + (vj[0] - vi[0]) * t, vi[1] + (vj[1] - vi[1]) * t];
      if (di >= 0){ A.push(I); AF.push(true); B.push(I); BF.push(F[i]); }   // выход из A: дальше по линии реза
      else { B.push(I); BF.push(true); A.push(I); AF.push(F[i]); }            // вход в A: дальше по старому ребру
    }
  }
  return { A: A.length >= 3 ? { V: A, F: AF } : null, B: B.length >= 3 ? { V: B, F: BF } : null };
}
// Чистка куска: слить близкие вершины, убрать почти прямые углы, не больше CFG.maxVerts вершин
// (убирается вершина с наименьшим треугольником — площадь теряется чуть-чуть). null — кусок выродился.
function cleanPoly(V, F){
  V = V.slice(); F = F.slice();
  const tri = (i) => { const n = V.length, a = V[(i + n - 1) % n], b = V[i], c = V[(i + 1) % n];
    return Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])) / 2; };
  const dropVertex = (i) => {               // вершина i уходит, рёбра i-1 и i сливаются; флаг — у более длинного
    const n = V.length, h = (i + n - 1) % n, a = V[h], b = V[i], c = V[(i + 1) % n];
    const keepCut = Math.hypot(b[0] - a[0], b[1] - a[1]) >= Math.hypot(c[0] - b[0], c[1] - b[1]) ? F[h] : F[i];
    F[h] = keepCut; V.splice(i, 1); F.splice(i, 1);
  };
  for (let guard = 0; guard < 64 && V.length >= 3; guard++){
    let k = -1;
    for (let i = 0; i < V.length; i++){
      const j = (i + 1) % V.length;
      if (Math.hypot(V[j][0] - V[i][0], V[j][1] - V[i][1]) < CFG.minEdge){ k = j; break; }
    }
    if (k < 0) for (let i = 0; i < V.length; i++) if (tri(i) < 0.05){ k = i; break; }
    if (k < 0 && V.length > CFG.maxVerts){ let m = Infinity; for (let i = 0; i < V.length; i++){ const t = tri(i); if (t < m){ m = t; k = i; } } }
    if (k < 0) break;
    dropVertex(k);
  }
  return V.length >= 3 && polyArea(V) > 0 ? { V, F } : null;
}

// shape: форма в виртуальных единицах при масштабе 1. Цвета — для серого вида и для бака (этап 2 рисует кодом).

// Локальные вершины вида (центр — центроид), масштаб sc. Выпуклая оболочка гарантирует совпадение с planck.
function kindVerts(kind, sc){
  const sh = KINDS[kind].shape, t = sh[0], P = [];
  if (t === 'circle' || t === 'ellipse'){
    const rx = sh[1] * sc, ry = (t === 'circle' ? sh[1] : sh[2]) * sc, m = sh[sh.length - 1];
    for (let k = 0; k < m; k++){ const a = (k + 0.5) * 2 * Math.PI / m; P.push([rx * Math.cos(a), ry * Math.sin(a)]); }
  } else if (t === 'lemon'){                       // овал с носиками по оси x
    const rx = sh[1] * sc, ry = sh[2] * sc, m = sh[3];
    for (let k = 0; k < m; k++){ const a = k * 2 * Math.PI / m, c = Math.cos(a), s = Math.sin(a);
      P.push([rx * c, ry * s * (1 - 0.22 * c * c * c * c)]); }
  } else if (t === 'berry'){                       // клубника: сужается книзу (y вниз)
    const rx = sh[1] * sc, ry = sh[2] * sc, m = sh[3];
    for (let k = 0; k < m; k++){ const a = (k + 0.5) * 2 * Math.PI / m, c = Math.cos(a), s = Math.sin(a);
      P.push([rx * c * (1 - 0.38 * Math.max(0, s)), ry * s]); }
  } else if (t === 'capsule'){                     // огурец: «стадион» вдоль x, по 6 точек на торец
    const hl = sh[1] * sc, r = sh[2] * sc, cx = hl - r;
    for (let k = 0; k < 6; k++){ const a = -Math.PI / 2 + k * Math.PI / 5; P.push([cx + r * Math.cos(a), r * Math.sin(a)]); }
    for (let k = 0; k < 6; k++){ const a = Math.PI / 2 + k * Math.PI / 5; P.push([-cx + r * Math.cos(a), r * Math.sin(a)]); }
  }
  const H = convexHull(P), c = polyCentroid(H);
  return H.map(v => [v[0] - c[0], v[1] - c[1]]);
}
// Кружки для раскладки кучи: [ox, oy, r] относительно центра; накрывают форму целиком.
function placeCircles(kind, sc, ang){
  const sh = KINDS[kind].shape;
  if (sh[0] === 'capsule'){
    const out = [], c = Math.cos(ang), s = Math.sin(ang), r = sh[2] * sc * 1.38, step = (sh[1] * sc - r) / 2;
    for (let k = -2; k <= 2; k++) out.push([c * k * step, s * k * step, r]);
    return out;
  }
  return [[0, 0, polyRadius(kindVerts(kind, sc))]];
}

// ------------------------------------------------------------------ детали короба
// Деталь уровня — запись-массив, тип первым элементом:
//   ['funnel', gx, gw, k, slot]         воронка: клинья от стен к щели ширины gw с центром gx; k — крутизна (подъём/пролёт);
//                                       slot — высота щели над жерновами (по умолчанию CFG.slotH)
//   ['twin', g1, g2, gw, k, slot]       две щели и «крыша» между ними
//   ['peg', x, y, r]                    штырь (восьмиугольник)
//   ['shelf', xw, xe, y, tiltDeg, lip]  полка от стены xw до xe на высоте y, наклон вниз к xe, бортик высотой lip
//   ['neck', y, w, h]                   «песочные часы»: треугольники от стен, горло ширины w на высоте y
//   ['block', x0, y0, x1, y1]           прямоугольник
//   ['gate', side, y, len, ropeY]       доска-ляда (этап 3): петля у стены side ('L' | 'R'), верх доски на высоте y, длина len,
//                                       бортик на свободном конце; верёвка от бортика вверх до крюка на высоте ropeY.
//                                       Перерезал верёвку — доска падает на петле и ссыпает кучу (динамическое тело)
//   ['spin', x, y, L, arms, dir, phase] вертушка (этап 3): кинематическая крестовина с центром (x, y), лопасти длины L,
//                                       arms лопастей, начальный поворот phase (X: 4 лопасти и π/4 — сверху «V», держит
//                                       горку); каждый потраченный рез поворачивает её на π/arms в сторону dir
// v3 (камеры заказа — где угодно в коробе, не только на дне):
//   ['bin', gx, gy, gw, xl, xr, k, t]   камера-воронка: щель ширины gw с центром gx, верх щели на gy; левое плечо — плита
//                                       от кромки щели вверх-влево до x = xl с подъёмом k, правое — до xr (null — плеча нет);
//                                       толщина плит t (по вертикали, по умолчанию 16). Под камерой — пусто: что прошло щель,
//                                       падает дальше (в камеру ниже или в зону полёта)
//   ['plate', x0, y0, x1, y1, t]        плита: отрезок — верхняя грань, толщина t вниз (вертикальная — вправо)
//   ['poly', [[x, y], …]]               выпуклый многоугольник
//   gate: ['gate', side, y, len, ropeY, hookX] — hookX (v3) — крюк не над бортиком, а в своей точке (верёвка наклонная)
// Подвижные детали (gate, spin): partPolys отдаёт их начальную позу (для раскладки кучи и вида), тела — dynParts.
const GATE_T = 12, GATE_LIP = 14;
// Петля — в GATE_HINGE ед. от стенки, торец доски заходит за неё на 10 ед.: углы торца ближе к петле, чем стенка,
// и доска проворачивается свободно (с петлёй у самого стекла угол торца упирался в стенку уже на 0,25 рад).
const GATE_HINGE = 12;
function gateShape(p){
  const [, side, y, len, ropeY, hookX] = p, dir = side === 'R' ? -1 : 1, hx = side === 'R' ? CFG.W - GATE_HINGE : GATE_HINGE, h = GATE_T / 2, L = len - GATE_HINGE;
  const box = (x0, y0, x1, y1) => convexHull([[dir * x0, y0], [dir * x1, y0], [dir * x1, y1], [dir * x0, y1]]);
  const local = [box(-(GATE_HINGE - 2), -h, L, h), box(L - 10, -h - GATE_LIP, L, -h)];
  return { hinge: [hx, y + h], local, attach: [dir * (L - 5), -h - GATE_LIP], anchor: [hookX == null ? hx + dir * (L - 5) : hookX, ropeY], dir };
}
function spinShape(p){
  const [, x, y, L, arms, , phase] = p, local = [], hub = [];
  for (let k = 0; k < arms; k++){ const t = k * 2 * Math.PI / arms + (phase || 0), c = Math.cos(t), sn = Math.sin(t);
    local.push(convexHull([[0, -7], [L, -7], [L, 7], [0, 7]].map(v => [c * v[0] - sn * v[1], sn * v[0] + c * v[1]]))); }
  for (let k = 0; k < 8; k++){ const a = (k + 0.5) * Math.PI / 4; hub.push([13 * Math.cos(a), 13 * Math.sin(a)]); }
  local.push(convexHull(hub));
  return { c: [x, y], local, step: Math.PI / arms };
}
const placeLocal = (P, o, a) => { const c = Math.cos(a || 0), sn = Math.sin(a || 0); return P.map(v => [o[0] + c * v[0] - sn * v[1], o[1] + sn * v[0] + c * v[1]]); };
function partPolys(p){
  const gy = CFG.floorY, W = CFG.W, out = [];        // v2: детали — бункеры, низ на floorY (под ним зона полёта)
  const slotTop = gy - (p[0] === 'funnel' ? p[4] || CFG.slotH : p[0] === 'twin' ? p[5] || CFG.slotH : CFG.slotH);
  const wedgeTop = (run, k) => slotTop - Math.min(run * k, 260);
  if (p[0] === 'funnel'){
    const [, gx, gw, k] = p, xl = gx - gw / 2, xr = gx + gw / 2;
    if (xl > 2) out.push({ role: 'wedge', poly: convexHull([[0, gy], [0, wedgeTop(xl, k)], [xl, slotTop], [xl, gy]]) });
    if (xr < W - 2) out.push({ role: 'wedge', poly: convexHull([[W, gy], [W, wedgeTop(W - xr, k)], [xr, slotTop], [xr, gy]]) });
  } else if (p[0] === 'twin'){
    const [, g1, g2, gw, k] = p, a = g1 + gw / 2, b = g2 - gw / 2, mid = (a + b) / 2;
    out.push({ role: 'wedge', poly: convexHull([[0, gy], [0, wedgeTop(g1 - gw / 2, k)], [g1 - gw / 2, slotTop], [g1 - gw / 2, gy]]) });
    out.push({ role: 'wedge', poly: convexHull([[W, gy], [W, wedgeTop(W - g2 - gw / 2, k)], [g2 + gw / 2, slotTop], [g2 + gw / 2, gy]]) });
    out.push({ role: 'roof', poly: convexHull([[a, gy], [a, slotTop], [mid, slotTop - Math.min((mid - a) * k, 200)], [b, slotTop], [b, gy]]) });
  } else if (p[0] === 'peg'){
    const [, x, y, r] = p, P = [];
    for (let k = 0; k < 8; k++){ const a = (k + 0.5) * Math.PI / 4; P.push([x + r * Math.cos(a), y + r * Math.sin(a)]); }
    out.push({ role: 'peg', poly: convexHull(P) });
  } else if (p[0] === 'shelf'){
    const [, xw, xe, y, tilt, lip] = p, th = 12, dir = Math.sign(xe - xw), len = Math.abs(xe - xw);
    const drop = len * Math.tan(tilt * Math.PI / 180), ye = y + drop;
    out.push({ role: 'shelf', poly: convexHull([[xw, y], [xe, ye], [xe, ye + th], [xw, y + th]]) });
    if (lip > 0) out.push({ role: 'shelf', poly: convexHull([[xe - dir * 10, ye - lip], [xe, ye - lip], [xe, ye + th], [xe - dir * 10, ye + th]]) });
  } else if (p[0] === 'neck'){
    const [, y, w, h] = p, x1 = (W - w) / 2;
    out.push({ role: 'neck', poly: convexHull([[0, y - h], [x1, y], [0, y + h]]) });
    out.push({ role: 'neck', poly: convexHull([[W, y - h], [W - x1, y], [W, y + h]]) });
  } else if (p[0] === 'block'){
    const [, x0, y0, x1, y1] = p;
    out.push({ role: 'block', poly: convexHull([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]) });
  } else if (p[0] === 'gate'){
    const G = gateShape(p); for (const P of G.local) out.push({ role: 'gate', dyn: true, poly: placeLocal(P, G.hinge, 0) });
  } else if (p[0] === 'spin'){
    const S = spinShape(p); for (const P of S.local) out.push({ role: 'spin', dyn: true, poly: placeLocal(P, S.c, 0) });
  } else if (p[0] === 'bin'){
    const [, gx, gy2, gw, xl, xr, k, t0] = p, t = t0 || 16, a = gx - gw / 2, b = gx + gw / 2;
    const arm = (x0, x1) => convexHull([[x0, gy2], [x1, gy2 - Math.abs(x0 - x1) * k], [x1, gy2 - Math.abs(x0 - x1) * k + t], [x0, gy2 + t]]);
    if (xl != null && xl < a - 1) out.push({ role: 'wedge', poly: arm(a, xl) });
    if (xr != null && xr > b + 1) out.push({ role: 'wedge', poly: arm(b, xr) });
  } else if (p[0] === 'plate'){
    out.push({ role: 'block', poly: plateQuad(p[1], p[2], p[3], p[4], p[5] || 14) });
  } else if (p[0] === 'poly'){
    out.push({ role: 'block', poly: convexHull(p[1]) });
  } else if (p[0] === 'grate'){                       // v4: прутья (круги planck), у каждого — зазор решётки
    for (const c of grateRods(p)){ const P = []; for (let k = 0; k < 8; k++){ const a = (k + 0.5) * Math.PI / 4; P.push([c[0] + c[2] * Math.cos(a), c[1] + c[2] * Math.sin(a)]); }
      out.push({ role: 'rod', poly: convexHull(P), circle: c, grate: p[5] }); }
  } else if (p[0] === 'net'){                         // v4: звенья авоськи
    netSegs(p).forEach(([a, b], i) => out.push({ role: 'net', poly: segQuad(a, b, CFG.netT), seg: i, a, b }));
  } else if (p[0] === 'plank'){
    const P = plankShape(p); for (const Q of P.local) out.push({ role: 'plank', dyn: true, poly: placeLocal(Q, P.c, 0) });
  } else if (p[0] === 'branch'){                      // v4: ветка — толстая плита от (x0, y0) до (x1, y1)
    out.push({ role: 'branch', poly: segQuad([p[1], p[2]], [p[3], p[4]], p[5] || 14) });
  }
  return out;
}
// ------------------------------------------------------------------ v4: решётка, сетка, доска на двух верёвках, гроздь
//   ['grate', x0, y0, x1, y1, gap, r]   решётка: прутья радиуса r (по умолчанию CFG.rodR) вдоль отрезка, просвет между
//                                       соседними — gap. Тело проходит сквозь прутья, если его наименьшая ширина
//                                       меньше gap − CFG.grateSlack (pre-solve выключает контакт): целый не пролезет,
//                                       половинка — проскочит
//   ['net', cx, y0, w, h, hole]         сетка-авоська: дуга из CFG.netSegs звеньев от левого края горловины (cx − w/2, y0)
//                                       через дно (cx, y0 + h) к правому; рез звена выбивает дыру шириной hole
//   ['plank', x0, x1, y, hookY, ridge]  доска на двух верёвках: верх доски на y, верёвки от крюков (x0 + 8, hookY) и
//                                       (x1 − 8, hookY) к её концам; ridge — x бортика-перегородки (null — нет)
//   ['vine', ax, ay, knots]             гроздь: крюк (ax, ay), черенок вниз через узлы knots = [[dx, dy, fruits], …] —
//                                       узел i в (узел i−1) + (dx, dy); fruits = [[вид, масштаб, dx, dy, tag], …] висят на
//                                       своих черенках от узла (центр фрукта — узел + (dx, dy)). Рез черенка между узлами
//                                       роняет всё ниже; рез черенка фрукта — один фрукт
//   ['branch', x0, y0, x1, y1, t]       ветка (статичная толстая плита)
function grateRods(p){
  const [, x0, y0, x1, y1, gap, r0] = p, r = r0 || CFG.rodR, L = Math.hypot(x1 - x0, y1 - y0), pitch = gap + 2 * r, n = Math.floor(L / pitch + 1e-6) + 1, out = [];
  const ux = (x1 - x0) / L, uy = (y1 - y0) / L, off = (L - (n - 1) * pitch) / 2;
  for (let k = 0; k < n; k++){ const t = off + k * pitch; out.push([x0 + ux * t, y0 + uy * t, r]); }
  return out;
}
// Середины просветов решётки (куда класть фрукт, чтобы он лёг на два прута).
function grateGaps(p){ const R = grateRods(p), out = []; for (let k = 0; k + 1 < R.length; k++) out.push([(R[k][0] + R[k + 1][0]) / 2, (R[k][1] + R[k + 1][1]) / 2]); return out; }
function segQuad(a, b, t){
  const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, nx = -(b[1] - a[1]) / L * t / 2, ny = (b[0] - a[0]) / L * t / 2, ex = (b[0] - a[0]) / L * t * 0.35, ey = (b[1] - a[1]) / L * t * 0.35;
  return convexHull([[a[0] - ex + nx, a[1] - ey + ny], [b[0] + ex + nx, b[1] + ey + ny], [b[0] + ex - nx, b[1] + ey - ny], [a[0] - ex - nx, a[1] - ey - ny]]);
}
function netSegs(p){
  const [, cx, y0, w, h] = p, n = CFG.netSegs, out = []; let prev = null;
  for (let k = 0; k <= n; k++){ const th = Math.PI * (1 - k / n), q = [cx + w / 2 * Math.cos(th), y0 + h * Math.pow(Math.sin(th), 0.9)]; if (prev) out.push([prev, q]); prev = q; }
  return out;
}
function plankShape(p){
  const [, x0, x1, y, hookY, ridge] = p, T = CFG.plankT, c = [(x0 + x1) / 2, y + T / 2], hw = (x1 - x0) / 2;
  const box = (a, b, c0, d) => convexHull([[a, b], [c0, b], [c0, d], [a, d]]);
  const local = [box(-hw, -T / 2, hw, T / 2)];
  if (ridge != null) local.push(box(ridge - c[0] - 5, -T / 2 - 24, ridge - c[0] + 5, -T / 2));
  local.push(box(-hw, -T / 2 - 6, -hw + 6, -T / 2), box(hw - 6, -T / 2 - 6, hw, -T / 2));   // низкие бортики по краям: целое не скатится само, на наклоне перекатится
  return { c, local, ends: [[-hw + 7, -T / 2], [hw - 7, -T / 2]], hooks: [[x0 + 8, hookY], [x1 - 8, hookY]] };
}
// Узлы грозди в мире: [[x, y], …] (по данным уровня, до физики).
function vineKnots(p){ const out = []; let x = p[1], y = p[2]; for (const k of p[3]){ x += k[0]; y += k[1]; out.push([x, y]); } return out; }
// Плита: отрезок (x0, y0)–(x1, y1) — лицевая грань, толщина t по нормали вниз (у вертикальной — вправо).
function plateQuad(x0, y0, x1, y1, t){
  const L = Math.hypot(x1 - x0, y1 - y0) || 1; let nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
  if (ny < -1e-9 || (Math.abs(ny) <= 1e-9 && nx < 0)){ nx = -nx; ny = -ny; }
  return convexHull([[x0, y0], [x1, y1], [x1 + nx * t, y1 + ny * t], [x0 + nx * t, y0 + ny * t]]);
}
// Расстояние от точки до выпуклого многоугольника (0 — внутри).
function polyDist(P, x, y){
  let inside = true, best = Infinity;
  for (let i = 0, n = P.length; i < n; i++){
    const a = P[i], b = P[(i + 1) % n], ex = b[0] - a[0], ey = b[1] - a[1], L2 = ex * ex + ey * ey;
    if ((x - a[0]) * ey - (y - a[1]) * ex > 0) inside = false;
    const t = L2 ? Math.max(0, Math.min(1, ((x - a[0]) * ex + (y - a[1]) * ey) / L2)) : 0;
    best = Math.min(best, Math.hypot(a[0] + ex * t - x, a[1] + ey * t - y));
  }
  return inside ? 0 : best;
}
// Щели (куда сыпать): x, верх щели y, ширина w — для ботов и подсказок вида.
function partGaps(parts){
  const g = [];
  for (const p of parts){
    if (p[0] === 'funnel') g.push({ x: p[1], y: CFG.floorY - (p[4] || CFG.slotH), w: p[2] });
    if (p[0] === 'twin'){ const y = CFG.floorY - (p[5] || CFG.slotH); g.push({ x: p[1], y, w: p[3] }); g.push({ x: p[2], y, w: p[3] }); }
    if (p[0] === 'bin') g.push({ x: p[1], y: p[2], w: p[3], yb: p[2] + (p[7] || 16), float: true });   // v3: щель камеры в воздухе
  }
  return g;
}

}

// v5. Куча на решётке. Чаша — профиль дна от левой стеклянной стенки до правой: точки [[x, y], …] и тип каждого отрезка

// ровно на каждом конце отрезка, без щели на стыке со стенкой). Раскрывается в детали 'poly' и 'grate' — решётка та же, что в v4:

// съезжает к решётке и не залёживается (форма вместо невидимых правил).
function BOWL(pts, types, t){

  for (const it of expandPile(L.pile)){

    const xlo = it[6] == null ? -Infinity : it[6], xhi = it[7] == null ? Infinity : it[7];
    const C = placeCircles(kind, sc, ang);
    let ext = 0, bot = 0, top = 0;
    for (const c of C){ ext = Math.max(ext, Math.abs(c[0]) + c[2]); bot = Math.max(bot, c[1] + c[2]); top = Math.max(top, c[2] - c[1]); }
    const width = 2 * ext;
    let best = null;
    for (let x = Math.ceil(ext + 1); x <= CFG.W - ext - 1; x += CFG.placeStep){
      if (x - ext < xlo || x + ext > xhi) continue;
      let y = Infinity, bad = false;
      const hit = (t, b, oy) => { t -= oy; b -= oy; if (b < from) return; if (t < from){ bad = true; return; } if (t < y) y = t; };
      for (const c of C){
        const cx = x + c[0], cr = c[2];
        y = Math.min(y, floorY - cr - c[1]);
        for (const P of polys){ const sp = polySpanAt(P, cx, cr); if (sp) hit(sp[0], sp[1], c[1]); }
        for (const q of circles){ const dx = cx - q[0], rr = cr + q[2]; if (Math.abs(dx) < rr){ const h = Math.sqrt(rr * rr - dx * dx); hit(q[1] - h, q[1] + h, c[1]); } }

      y -= CFG.placeGap;
      if (y - top < CFG.pileTop) continue;
      for (const g of gaps) if (width < g.w + (g.float ? 2 : 8) && Math.abs(x - g.x) < g.w / 2 + ext && y + bot > g.y - 2 && !(g.float && y - top > g.yb)) bad = true;   // v3: под щелью камеры в воздухе — можно
      if (bad) continue;

    out.push({ kind, x: best.x, y: best.y, a: ang, sc, tag });
    for (const c of C) circles.push([best.x + c[0], best.y + c[1], c[2]]);
  }
  return out;
}

// Скорлупа (кокос): первый рез — трещина (тело целое, ход потрачен), следующий — раскол как у обычного фрукта.

// Перец-бомба: тело уходит в сок, взрыв толкает соседей от центра и раскалывает близких по лучу; скорлупу в радиусе

// Цель одна — пропихнуть всю кучу в жернова. Куча лежит на клиньях и полках со щелями (детали v1–v3: funnel, twin, bin, shelf,
// plate, peg); пролезает то, что уже щели. Помехи: крупное (шире щели), твёрдое (кокос: нож отскакивает, пила глохнет), длинное
// (огурец поперёк щели), затор (мелочь аркой над щелью), плотная куча. Инструменты — CFG.WEAPONS7, у каждого один глагол.
const isHard = (b) => !!KINDS[b.kind].hard && !b.flags.cut && !b.flags.chew;
// Где нож или пила на отрезке (ax, ay) → (bx, by) упирается в твёрдое (ось ножа; у пилы — полотно шириной kerfW): { b, t, x, y } или null.
function hardOnSeg(s, F, W, ax, ay, bx, by){
  const thr = W.hardStop === 'stall' ? W.kerfW / 2 : 0.5, L = Math.hypot(bx - ax, by - ay), H = [];
  for (const b of s.bodies) if (isHard(b) && !(F && F.skip.has(b.id)) && segPtDist(ax, ay, bx, by, b.x, b.y) <= b.rad + thr + 1) H.push(b);
  if (!H.length) return null;
  const n = Math.max(1, Math.ceil(L / 2));
  for (let k = 0; k <= n; k++){ const t = k / n, x = ax + (bx - ax) * t, y = ay + (by - ay) * t;
    for (const b of H){ const l = toLocal(b, x, y); if (polyDist(b.verts, l[0], l[1]) <= thr) return { b, t, x, y }; } }
  return null;
}
// То же по всей траектории (предпросмотр): { b, d, p } — где по длине пути упрётся.
function hardStopAt(s, W, path, skip){
  let acc = 0;
  for (let i = 1; i < path.length; i++){ const a = path[i - 1], c = path[i], L = Math.hypot(c[0] - a[0], c[1] - a[1]);
    const h = hardOnSeg(s, { skip }, W, a[0], a[1], c[0], c[1]); if (h) return { b: h.b, d: acc + L * h.t, p: [h.x, h.y] }; acc += L; }
  return null;
}
// Траектория, обрезанная на длине d (≥ 2 точки), или null.
function cutPath(path, d){
  if (d < 1) return null; const out = [path[0]]; let acc = 0;
  for (let i = 1; i < path.length; i++){ const a = path[i - 1], c = path[i], L = Math.hypot(c[0] - a[0], c[1] - a[1]);
    if (acc + L >= d){ const f = L ? (d - acc) / L : 0; out.push([a[0] + (c[0] - a[0]) * f, a[1] + (c[1] - a[1]) * f]); return out; }
    out.push(c); acc += L; }
  return out;
}
// Нож отскочил от твёрдого / пила заглохла: полёт кончен; если бросок ничего не разрезал — инструмент возвращается (не тратится).
// Кокос вздрагивает от удара.
function hardStop(s, F, W, b, x, y, ux, uy){
  F.done = true; F.stuckId = null;
  const refund = !F.free && F.cuts === 0;
  if (refund){ s.ammo[F.w] = (s.ammo[F.w] || 0) + 1; s.moves++; s.used--; if (s.weapon !== F.w){ s.weapon = F.w; ev(s, { type: 'weapon', w: F.w, auto: true }); }
    if (s.cutWin) s.cutWin.free = true; }
  F.bounce = { id: b.id, x: +x.toFixed(1), y: +y.toFixed(1), how: W.hardStop, refund };
  const v = b.pb.getLinearVelocity(); b.pb.setAwake(true); b.pb.setLinearVelocity(planck.Vec2(v.x + ux * 25 / CFG.ppm, v.y + uy * 25 / CFG.ppm - 20 / CFG.ppm));
  ev(s, { type: 'bounce', w: F.w, how: W.hardStop, id: b.id, kind: b.kind, x: +x.toFixed(1), y: +y.toFixed(1), ux: +ux.toFixed(3), uy: +uy.toFixed(3), free: !!F.free || refund });
}
// Булава: летит до первого касания (голова r), центр удара — на dip глубже по ходу; всё, что ближе R к центру, — в осколки.
function maceImpact(s, W, a, c, skip){
  const L = Math.hypot(c[0] - a[0], c[1] - a[1]), ux = (c[0] - a[0]) / (L || 1), uy = (c[1] - a[1]) / (L || 1), n = Math.max(1, Math.ceil(L / 3));
  for (let k = 0; k <= n; k++){ const px = a[0] + (c[0] - a[0]) * k / n, py = a[1] + (c[1] - a[1]) * k / n;
    for (const b of s.bodies){ if (b.flags.chew || (skip && skip.has(b.id)) || Math.hypot(b.x - px, b.y - py) > b.rad + W.r) continue;
      const l = toLocal(b, px, py); if (polyDist(b.verts, l[0], l[1]) > W.r) continue;
      const dx = b.x - px, dy = b.y - py, dd = Math.hypot(dx, dy) || 1, m = Math.min(dd, W.dip);   // центр удара — внутри задетого тела
      return { px, py, cx: px + dx / dd * m, cy: py + dy / dd * m, ux, uy, d: L * k / n }; } }
  return null;
}
function maceTargets(s, W, cx, cy, skip){
  const out = [];
  for (const b of s.bodies){ if (b.flags.chew || (skip && skip.has(b.id)) || Math.hypot(b.x - cx, b.y - cy) > b.rad + W.R) continue;
    const l = toLocal(b, cx, cy), d = polyDist(b.verts, l[0], l[1]); if (d <= W.R) out.push({ b, d }); }
  return out.sort((p, q) => p.d - q.d);

function macePreview(s, W, path, skip, out){
  const a = path[0], c = path[path.length - 1], I = maceImpact(s, W, a, c, skip); if (!I) return { hits: out, end: c };
  for (const t of maceTargets(s, W, I.cx, I.cy, skip)) out.push({ id: t.b.id, how: 'smash', p: [I.cx, I.cy], q: [I.cx, I.cy], d: I.d, m: +(W.R - t.d).toFixed(1) });
  return { hits: out, end: [I.px, I.py], ring: { x: +I.cx.toFixed(1), y: +I.cy.toFixed(1), R: W.R } };
}
function smashCircle(s, F, W, px, py, ux, uy){
  const I = maceImpact(s, W, [px - ux * 4, py - uy * 4], [px + ux * 4, py + uy * 4], F.skip), cx = I ? I.cx : px + ux * W.dip, cy = I ? I.cy : py + uy * W.dip, T = maceTargets(s, W, cx, cy, F.skip);
  F.noShake = true;
  for (const t of T){ if (!s.bodies.includes(t.b)) continue; F.hit.add(t.b.id); F.hits++; smash(s, F, W, t.b, cx, cy, ux, uy); F.cuts++; }
  F.noShake = false; F.done = true; F.slow *= W.slow;
  shakePile(s, cx, cy, W.shakeR, W.shakeV, F.skip);
  ev(s, { type: 'mace', x: +cx.toFixed(1), y: +cy.toFixed(1), R: W.R, n: T.length });
}
// Сколько кучи осталось: тела + сок, что едет с ними.
function heapLeft(s){ let a = 0; for (const b of s.bodies) a += b.area + (b.juiceX || 0); return a; }
// Осталось меньше CFG.sweepAt — победа, остатки проваливаются сквозь детали в жернова (чтобы не добивать крошки).
function clearCheck(s){
  if (heapLeft(s) > CFG.sweepAt * s.total) return false;
  s.won = true; s.swept = true; s.winUsed = s.used; s.winPeak = s.peakNet;
  let a = 0; const n = s.bodies.length;
  for (const b of s.bodies){ a += b.area; b.flags.swept = true;
    for (let f = b.pb.getFixtureList(); f; f = f.getNext()) f.setFilterMaskBits(0);
    const v = b.pb.getLinearVelocity(); b.pb.setAwake(true); b.pb.setLinearVelocity(planck.Vec2(v.x * 0.3, Math.max(v.y, 90 / CFG.ppm))); }
  ev(s, { type: 'sweep', n, area: +a.toFixed(0), share: +(a / s.total).toFixed(3) });
  ev(s, { type: 'win', juice: +(s.juice / s.total).toFixed(3), moves: s.moves, sweep: n > 0 });
  return true;
}

// Планировщик с упреждением 0,25 с; приглушение (duck) на крупных событиях.
const MUSIC = {
  bpm: 100, vol: 0.12,
  prog: [[53, 57, 60], [50, 53, 57], [46, 50, 53], [48, 52, 55]],
  mel: [72, 0, 69, 0, 67, 69, 0, 0, 65, 0, 67, 0, 69, 0, 72, 0, 74, 0, 72, 0, 69, 67, 0, 0, 67, 0, 69, 0, 72, 0, 0, 0,
        77, 0, 74, 0, 72, 74, 0, 0, 72, 0, 69, 0, 67, 0, 69, 0, 72, 0, 69, 0, 67, 65, 0, 0, 67, 0, 65, 0, 0, 0, 0, 0],
};
const Music = {
  on: false, next: 0, step: 0, hyped: false,
  hype(on){ this.hyped = !!on; if (Sound.mus && Sound.ac){ const t = Sound.ac.currentTime; Sound.mus.gain.cancelScheduledValues(t); Sound.mus.gain.setTargetAtTime(MUSIC.vol * (on ? 1.6 : 1), t, 0.08); } log('sound', 'music.hype', on ? 'on' : 'off'); },
  start(){ if (!Sound.ac || this.on) return; this.on = true; this.next = Sound.ac.currentTime + 0.1; this.step = 0; log('sound', 'music.start'); },
  stop(){ if (!this.on) return; this.on = false; log('sound', 'music.stop'); },
  tick(){
    const ac = Sound.ac; if (!this.on || !ac || G.save.muted || ac.state !== 'running') return;
    const e = 60 / (theme().music || MUSIC).bpm / 2 / (this.hyped ? 1.3 : 1);    // восьмая; темп — от мира (в FRENZY ×1,3)
    if (this.next < ac.currentTime) this.next = ac.currentTime + 0.05;   // после паузы вкладки
    while (this.next < ac.currentTime + 0.25){ this.note(this.step, this.next, e); this.step = (this.step + 1) % 64; this.next += e; }
  },
  pluck(m, t, dur, v){ const f = midi(m); Sound.tone(t, 'sine', f, f, dur, v, Sound.mus); Sound.tone(t, 'sine', f * 4, f * 4, dur * 0.22, v * 0.18, Sound.mus); },
  // Оттенок мира (THEMES.music): сдвиг тональности, темп и рисунок баса — 'half' (на 1 и 3), 'walk' (шагом по аккорду),
  // 'reggae' (бас на слабые доли, аккорды «скэнком»).
  note(k, t, e){
    const mu = theme().music || { shift: 0, bass: 'half' }, sh = mu.shift || 0;
    const ch = MUSIC.prog[Math.floor(k / 8) % 4].map(n => n + sh), beat = k % 8, m = MUSIC.mel[k % 64] && MUSIC.mel[k % 64] + sh;
    const bass = (n, d) => Sound.tone(t, 'triangle', midi(n - 12), midi(n - 12), e * d, 0.55, Sound.mus, 0.01);
    if (mu.bass === 'walk'){ if (beat % 2 === 0) bass([ch[0], ch[1], ch[2], ch[1]][beat / 2], 1.6); }
    else if (mu.bass === 'reggae'){ if (beat === 2 || beat === 6) bass(ch[0], 1.4); if (beat === 7) bass(ch[2], 0.8); }
    else if (beat === 0 || beat === 4) bass(ch[0], 1.8);
    if (mu.bass === 'reggae' ? beat === 2 || beat === 6 : beat % 2 === 1) for (const n of ch) this.pluck(n + 12, t, e * 1.5, 0.13);
    if (m) this.pluck(m, t, e * 1.7, 0.3);
    if (m && this.hyped) this.pluck(m + 12, t, e, 0.16);
    if (beat % 2 === 0 || this.hyped) Sound.noise(t, 'highpass', 8000, 8000, 0.7, 0.03, this.hyped ? 0.07 : 0.05, Sound.mus);
  },
  duck(depth, dur){
    if (!Sound.mus) return;

    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(base * depth, t + 0.05); g.setTargetAtTime(base, t + dur, 0.3);
  },
};

// запасной путь: щелчок по скрытому переключателю (input switch) даёт короткий тактильный тик (Safari 17.4+); длительность не задаётся.
let HAP_SW = null, HAP_AT = 0;
function hapTick(){
  try {
    if (!HAP_SW){ const l = document.createElement('label'); l.setAttribute('aria-hidden', 'true'); l.style.cssText = 'position:fixed;left:-99px;top:-99px;width:1px;height:1px;overflow:hidden';
      const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i); document.body.appendChild(l); HAP_SW = l; }
    HAP_SW.click();
  } catch (e) {}
}
function buzz(ms){ if (!Sound.ac) return; try { if (navigator.vibrate) navigator.vibrate(ms); else hapTick(); } catch (e) {} }

  for (let i = 0; i < s.layers.length; i++){ const want = s.layers[i].fill / s.layers[i].vol; O.show[i] = (O.show[i] || 0) + (want - (O.show[i] || 0)) * Math.min(1, rdt * 7); if (want >= 1 && O.show[i] > 0.995) O.show[i] = 1; }

function dragTo(A, d){

    if (acc + L <= d + 1e-9){ if (i >= A.vi){ throwMove(A.pts[i][0], A.pts[i][1]); A.vi = i + 1; } } else break; acc += L; }
  const q = flightAt({ path: A.pts }, d); throwMove(q[0], q[1]);

  const A = G.autoStroke; if (!A) return; if (!G.s || !G.s.stroke){ G.autoStroke = null; return; }
  const at = (d) => { let a = 0; for (let i = 1; i < A.pts.length; i++){ const L = Math.hypot(A.pts[i][0] - A.pts[i - 1][0], A.pts[i][1] - A.pts[i - 1][1]); if (a + L >= d){ const f = L ? (d - a) / L : 1; return [A.pts[i - 1][0] + (A.pts[i][0] - A.pts[i - 1][0]) * f, A.pts[i - 1][1] + (A.pts[i][1] - A.pts[i - 1][1]) * f]; } a += L; } return A.pts[A.pts.length - 1]; };
  for (let j = 1; j <= 4; j++){ const q = at(A.tot * (A.f + j / 4) / A.frames); directMove(q[0], q[1]); }

  know(){ return G.s ? botKnow(G.s) : null; },                                   // v3: линия знающего порядок (решение уровня); v6 — { w, pts }
  // v6: оружие. weapon(name) — выбрать (без аргумента — выбранное); loadout() — набор { ammo, weapon, flight };
  // throw(name, pts, ms) — бросок: палец вниз в pts[0], ведёт по pts за ms мс (кадры по 1/60), отпускает; полёт дальше — drive()
  weapon(name){ if (!G.s) return null; if (name){ pickWeapon(G.s, name); pump(); } return G.s.weapon; },
  // v6: прицел без броска (для кадров): палец вниз в pts[0] и ведёт по pts; aim6() — убрать (бросок не делается)
  aim6(name, pts){ if (!G.s) return null; if (!pts){ throwUp(true); render(); return null; } if (name) pickWeapon(G.s, name); if (G.aim) throwUp(true);
    if (!throwDown(pts[0][0], pts[0][1], -5)) return null; const A = { pts, vi: 1 }; if (pts.length > 1) dragTo(A, pathLen(pts)); G.aim.t0 = G.rt - 1; render();
    const path = weaponPath(G.aim.w, G.aim.pts); return path ? throwPreview(G.s, G.aim.w, path).hits.map(h => h.how) : []; },
  loadout(){ const s = G.s; return s && s.ammo ? { ammo: Object.assign({}, s.ammo), weapon: s.weapon, flight: s.flight ? { w: s.flight.w, d: +s.flight.d.toFixed(1), total: +s.flight.total.toFixed(1) } : null } : null; },
  throw(name, pts, ms){
    if (!G.s || !pts || !pts.length) return null; if (name) pickWeapon(G.s, name);
    if (!throwDown(pts[0][0], pts[0][1], -4)) return Object.assign({ spent: false, reason: 'busy' }, this.state());
    const frames = Math.max(1, Math.round((ms === undefined ? 160 : ms) / 1000 * 60)), tot = Math.max(1e-6, pathLen(pts)), A = { pts, vi: 1 };
    for (let f = 1; f <= frames; f++){ if (pts.length > 1) dragTo(A, tot * f / frames); frameStep(1 / 60); }
    const r = throwUp() || { spent: false }; render();
    return Object.assign({ spent: r.spent, hits: r.hits || 0, reason: r.reason }, this.state());
  },
  greedy(){ return G.s ? botGreedy(G.s) : null; },                               // v3: линия жадного (самая большая пробка)
  // v7: уровень n записанным решением — тот же протокол, что replay7 в sim (ждать покоя и пустых жерновов, бросок, полёт, покой);
  // броски — ядром браузера, отклик вида — событиями. → { won, used, left, throws: [{ w, gain }] }
  play7(n){
    if (CFG.goalMode !== 'clear') setGoalMode('clear'); startLevel(n || 1);
    const s = G.s, L = s.level.solution || [], out = [];
    const settle = () => { let k = 0; while (!s.won && !s.lost && (s.flight || !isSettled(s) || s.grinding.length) && k++ < 1440) step(s); };
    for (const t of L){ settle(); if (s.won || s.lost || !(s.ammo[t.w] > 0)) break;
      const g0 = s.ground || 0; pickWeapon(s, t.w); const r = throwWeapon(s, t.w, t.pts); let k = 0; while (s.flight && k++ < 2400) step(s); settle(); pump();
      out.push({ w: t.w, spent: r.spent, gain: +(((s.ground || 0) - g0) / s.total).toFixed(3) }); }
    let k = 0; while (!s.won && !s.lost && k++ < 2400) step(s); pump(); render();
    return { level: s.n, name: s.level.name, won: s.won, lost: s.lost, used: s.used, left: s.moves, heapLeft: +(heapLeft(s) / s.total).toFixed(3), throws: out };
  },
  cut(ax, ay, bx, by){ const r = doCut(ax, ay, bx, by); return Object.assign({ cut: r.cut, spent: r.spent }, this.state()); },
  // v2: взмах по следу пальца — ломаная pts [[x, y], …] в координатах поля за ms реальных миллисекунд (кадры по 1/60:
  // палец сдвигается, тела режутся по ходу, физика идёт). Режет в любом режиме лезвия. → { cut, spent, len, …state }
  stroke(pts, ms){
    if (!G.s || !pts || pts.length < 2) return null;
    let total = 0; for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const at = (d) => { let acc = 0; for (let i = 1; i < pts.length; i++){ const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (acc + L >= d){ const f = L ? (d - acc) / L : 1; return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]; } acc += L; } return pts[pts.length - 1]; };
    const frames = Math.max(1, Math.round((ms === undefined ? 120 : ms) / 1000 * 60));
    G.aim = { ax: pts[0][0], ay: pts[0][1], bx: pts[0][0], by: pts[0][1], id: -2, direct: true }; directDown(pts[0][0], pts[0][1]);
    for (let f = 1; f <= frames; f++){ const k = 4; for (let j = 1; j <= k; j++){ const p = at(total * (f - 1 + j / k) / frames); directMove(p[0], p[1]); } frameStep(1 / 60); }
    G.aim = null; const r = directUp() || { cut: 0, spent: false, len: 0 }; render();
    return Object.assign({ cut: r.cut, spent: r.spent, len: Math.round(r.len) }, this.state());
  },
  blade(mode){ if (mode) setBlade(mode); return CFG.bladeMode; },
  style(st){ if (st) setStyle(st); return ART_STYLE; },                             // v5: набор арта 'toy' | 'sticker' | 'real'
  preview(ax, ay, bx, by){ return G.s ? previewCut(G.s, ax, ay, bx, by) : []; },
  bodies(){ return G.s ? G.s.bodies.map(b => ({ id: b.id, kind: b.kind, x: Math.round(b.x), y: Math.round(b.y), area: Math.round(b.area), r: Math.round(b.rad) })) : []; },
  // ручной прогон: sec реальных секунд кадрами по 1/60 (физика × timeScale, эффекты, слова) — rAF заморожен в скрытой вкладке
  drive(sec){ const n = Math.round((sec === undefined ? 1 : sec) * 60); for (let i = 0; i < n; i++) frameStep(1 / 60); render(); return this.state(); },
  aim(ax, ay, bx, by){ if (!G.s) return null; G.aim = bx === undefined ? null : { ax, ay, bx, by, id: -1 }; render(); return G.aim ? previewCut(G.s, ax, ay, bx, by).length : 0; },   // прицел без реза (для кадров)
  fx(){ return { particles: PT.n, drips: FX.drips.length, words: FX.words.map(w => w.text), sprites: SPR.size, bakes: bakeCount, layers: FX.layers.length,
    confetti: FX.confetti.length, hand: FX.tut.on, intro: G.rt < G.introUntil, timeScale: G.timeScale }; },
  goto(screen){ goto(screen); return G.screen; },
  auto(mode){ G.auto = mode === false ? '' : (mode || 'smart'); log('event', 'auto', G.auto || 'off'); return G.auto; },
  speed(x){ G.speed = x || 1; return G.speed; },
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },   // чит: открыть все уровни
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
  bench(opt){ return bench(opt); },
  // живой замер на настоящем цикле rAF (GPU-холст, как на телефоне): куча ≈150 кусков, sec секунд покоя, рез, sec секунд лавины.
  // Отдаёт интервалы между кадрами и время работы главного потока на кадр (tick).
  live(sec){ return liveBench(sec || 2); },
  // v6: живая автоигра знающим уровней from…to на своём цикле rAF (как телефон): интервалы кадров и работа главного потока.
  liveAuto(from, to, maxSec){ return liveAuto(from || 1, to || from || 1, maxSec || 110); },
};

// --- замер кадра (DESIGN «Кадр»): тяжёлый уровень ≈ 150 кусков, медиана отрисовки и кадр реза ---
// Отрисовка меряется с принудительной синхронизацией холста (getImageData 1×1): Chrome после неё растеризует холст
// на CPU, и performance.now() видит полную цену кадра, а не только запись команд (cpuMedian — запись без синхронизации).
// Кадр реза = рез + frameStep(1/60) + render; дальше 60 кадров лавины.
// Куча для замера: уровень opt.level, нарезанный до opt.target кусков (крупнейшее тело поперёк центра, без шагов физики);
// куски спят — как в игре через ~0,5 с после реза. События нарезки виду не показываются.
function benchPile(opt){
  startLevel(opt.level);
  const s = G.s; s.moves = 999; G.introUntil = G.rt; FX.intro.clear();
  for (let k = 0; k < 400 && s.bodies.length < opt.target; k++){
    let m = null; for (const b of s.bodies) if (!b.flags.chew && (!m || b.area > m.area)) m = b;
    if (!m || m.area < 260) break;
    const a = k * 2.399, h = Math.min(CFG.bladeMax / 2, m.rad + 8);
    applyCut(s, m.x - Math.cos(a) * h, m.y - Math.sin(a) * h, m.x + Math.cos(a) * h, m.y + Math.sin(a) * h);
  }
  drainEvents(s); s.cutWin = null;
  for (const b of s.bodies) b.pb.setAwake(false);
  return s;
}
function bench(opt){
  opt = Object.assign({ level: 23, target: 150, frames: 240 }, opt || {});
  const flush = () => ctx.getImageData(0, 0, 1, 1);
  const pct = (a, q) => { const b = a.slice().sort((x, y) => x - y); return +b[Math.min(b.length - 1, Math.floor(q * b.length))].toFixed(2); };
  const s = benchPile(opt);
  const n = s.bodies.length, rt = [];
  render(); flush();
  for (let i = 0; i < opt.frames; i++){ const t0 = performance.now(); render(); flush(); rt.push(performance.now() - t0); }
  const cpu = [], fl = [];
  for (let i = 0; i < 60; i++){ const t0 = performance.now(); render(); cpu.push(performance.now() - t0); flush(); }
  for (let i = 0; i < 60; i++){ ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillRect(0, 0, 1, 1); const t0 = performance.now(); flush(); fl.push(performance.now() - t0); }
  for (let i = 0; i < 30; i++){ frameStep(1 / 60); render(); flush(); }   // каждый кадр растеризуется, как при показе
  let best = null, bestN = -1;
  for (let y = 200; y <= 560; y += 20) for (const a of [0, 0.4, -0.4]){
    const L = CFG.bladeMax / 2, line = [200 - Math.cos(a) * L, y - Math.sin(a) * L, 200 + Math.cos(a) * L, y + Math.sin(a) * L];
    const c = previewCut(s, ...line).length; if (c > bestN){ bestN = c; best = line; }
  }
  const b0 = bakeCount, t0 = performance.now();
  doCut(...best); frameStep(1 / 60); render(); flush();
  const cutMs = performance.now() - t0, cutBakes = bakeCount - b0, after = [];
  let peakP = 0;
  for (let i = 0; i < 60; i++){ const t1 = performance.now(); frameStep(1 / 60); render(); flush(); after.push(performance.now() - t1); peakP = Math.max(peakP, PT.n); }
  const out = { bodies: n, cssW: Math.round(view.w), cssH: Math.round(view.h), dpr: DPR, canvas: cv.width + '×' + cv.height,
    renderMedian: pct(rt, 0.5), renderP95: pct(rt, 0.95), renderMax: pct(rt, 1), long16: +(rt.filter(v => v > 16.7).length / rt.length).toFixed(3),
    cpuMedian: pct(cpu, 0.5), flushMedian: pct(fl, 0.5),
    cutBodies: bestN, cutBakes, cutFrame: +cutMs.toFixed(2), afterMedian: pct(after, 0.5), afterMax: pct(after, 1), after33: after.filter(v => v > 33).length, peakParticles: peakP };
  log('event', 'bench', JSON.stringify(out));
  return out;
}

// Живой замер не читает холст (getImageData перевёл бы его на CPU) — гонять на свежей странице без ?cpu.
function liveBench(sec){
  const s = benchPile({ level: 23, target: 150 }), iv = [], work = [], cutAt = { i: -1 };
  let last = performance.now(), t0 = last, phase = 0;
  const q = (a, f) => { const b = a.slice().sort((x, y) => x - y); return +b[Math.min(b.length - 1, Math.floor(f * b.length))].toFixed(2); };
  return new Promise((done) => {
    const origTick = tick;
    function f(){
      const now = performance.now(); iv.push(now - last); last = now;
      const w0 = performance.now(); origTick(); work.push(performance.now() - w0);
      if (phase === 0 && now - t0 > sec * 1000){ phase = 1; cutAt.i = iv.length;
        let best = null, bn = -1;
        for (let y = 200; y <= 560; y += 20) for (const a of [0, 0.4, -0.4]){ const L = CFG.bladeMax / 2, line = [200 - Math.cos(a) * L, y - Math.sin(a) * L, 200 + Math.cos(a) * L, y + Math.sin(a) * L];
          const c = previewCut(s, ...line).length; if (c > bn){ bn = c; best = line; } }
        doCut(...best); }
      if (phase === 1 && now - t0 > 2 * sec * 1000){
        const idle = iv.slice(5, cutAt.i), act = iv.slice(cutAt.i), wi = work.slice(5, cutAt.i), wa = work.slice(cutAt.i);
        done({ frames: iv.length, idleIntervalMedian: q(idle, 0.5), idleOver20: idle.filter(v => v > 20).length, idleWorkMedian: q(wi, 0.5),
          actIntervalMedian: q(act, 0.5), actIntervalMax: q(act, 1), actOver33: act.filter(v => v > 33.4).length, actWorkMedian: q(wa, 0.5), actWorkMax: q(wa, 1),
          cutFrameWork: +work[cutAt.i].toFixed(2), cutFrameInterval: +(iv[cutAt.i + 1] || 0).toFixed(2) });
        G.liveBench = false; return; }
      requestAnimationFrame(f);
    }
    G.liveBench = true; requestAnimationFrame(f);
  });
}

// v6: живой замер автоигрой знающего (уровни from…to подряд; после подачи игра сама идёт дальше). Останавливается на уровне за to,
// на проигрыше или по maxSec. → { frames, ivMed, ivMax, over33, workMed, workP95, workMax, per: { уровень: served|lost }, liqMax }.
function liveAuto(from, to, maxSec){
  G.paused = false; setUnlockAll(true); startLevel(from); G.auto = 'know';
  const q = (a, f) => { const b = a.slice().sort((x, y) => x - y); return b.length ? +b[Math.min(b.length - 1, Math.floor(f * b.length))].toFixed(2) : 0; };
  let last = performance.now(); const t0 = last, iv = [], work = [], per = {}, worst = []; let liqMax = 0, ptMax = 0;
  return new Promise((done) => {
    function f(){
      const now = performance.now(); iv.push(now - last); last = now; const w0 = performance.now(); tick(); const wk = performance.now() - w0; work.push(wk);
      if (wk > 12){ const s0 = G.s; worst.push({ ms: +wk.toFixed(1), n: s0 && s0.n, t: s0 && +s0.t.toFixed(2), screen: G.screen, flight: s0 && s0.flight ? s0.flight.w : '', bodies: s0 && s0.bodies.length, intro: G.rt < G.introUntil }); }
      liqMax = Math.max(liqMax, LIQ.n); ptMax = Math.max(ptMax, PT.n);
      const s = G.s; if (s){ if (!per[s.n]) per[s.n] = 'play'; if (s.served || (s.mode === 'clear' && s.won)) per[s.n] = 'won'; if (s.lost) per[s.n] = 'lost'; }
      if ((s && s.n > to) || now - t0 > maxSec * 1000 || (s && s.lost && G.screen === 'lose')){
        G.liveBench = false; G.auto = ''; const v = iv.slice(5), w = work.slice(5);
        done({ frames: v.length, sec: +((now - t0) / 1000).toFixed(1), ivMed: q(v, 0.5), ivMax: q(v, 1), over20: v.filter(x => x > 20).length, over33: v.filter(x => x > 33.4).length,
          workMed: q(w, 0.5), workP95: q(w, 0.95), workMax: q(w, 1), per, liqMax, ptMax, worst: worst.slice(0, 12) }); return; }
      requestAnimationFrame(f);
    }
    G.liveBench = true; requestAnimationFrame(f);
  });
}

// --- старт ---
fit(); hud(); liqInit();
if (document.fonts && document.fonts.load) document.fonts.load('700 20px ' + FONT).then(() => { buildBackground(); log('event', 'font', FONT); }).catch(() => {});
// v2: режим лезвия хешем — #aim (прицел v1, сразу в игру) или #direct; иначе — из сейва (меню «Blade»), по умолчанию CFG.bladeMode
function setBlade(mode){ CFG.bladeMode = mode === 'aim' ? 'aim' : 'direct'; G.save.blade = CFG.bladeMode; save(); G.aim = null; log('event', 'blade', CFG.bladeMode); }
if (G.save.blade === 'aim' || G.save.blade === 'direct') CFG.bladeMode = G.save.blade;
if (!G.save.v7){ G.save.v7 = 1; G.save.goal = 'clear'; save(); }   // v7: старый сейв (v6) — один раз переключить на «развали»
if (G.save.goal === 'tank' || G.save.goal === 'order' || G.save.goal === 'clear') CFG.goalMode = G.save.goal;
if (G.save.oset === 'v3' || G.save.oset === 'v4' || G.save.oset === 'v5') CFG.orderSet = G.save.oset;   // набор уровней заказа из сейва (меню «Levels»), по умолчанию — v5
if (STYLES.includes(G.save.style)) ART_STYLE = G.save.style;                    // v5: набор арта из сейва (меню «Art»)
let startHash = location.hash.slice(1) === 'unlock' ? (setUnlockAll(true), 'menu') : location.hash.slice(1);
if (startHash === 'aim' || startHash === 'direct'){ setBlade(startHash); if (CFG.orderSet === 'v6') setOrderSet('v5'); startHash = 'game'; }   // v6: #direct — прежний взмах (уровни v5)
if (startHash === 'tank' || startHash === 'order'){ setGoalMode(startHash); startHash = 'game'; }
if (startHash === 'v3' || startHash === 'v4' || startHash === 'v5' || startHash === 'v6'){ setGoalMode('order'); setOrderSet(startHash); startHash = 'game'; }
if (startHash === 'v7'){ setGoalMode('clear'); startHash = 'game'; }
if (startHash.startsWith('style=')){ ART_STYLE = STYLES.includes(startHash.slice(6)) ? startHash.slice(6) : 'toy'; G.save.style = ART_STYLE; save(); if (CFG.goalMode !== 'order') setGoalMode('order'); startHash = 'game'; }
if (startHash === 'game') startLevel(curLevel());
else if (startHash === 'win' || startHash === 'lose'){ startLevel(curLevel()); goto(startHash); }
else goto(startHash || 'menu');
loadAssets(); ASSETS.onReady.push(() => { resetSprites(); woodPat = null; buildBackground(); });   // v4: спрайты GPT и фон
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length + '+gen planck=1.4.2');
</script>
