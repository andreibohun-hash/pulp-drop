<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulp Drop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#281c45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Свой шрифт файлом (PROTO-BASE §1, §11): Fredoka, SIL OFL — vendor/FONTS-LICENSE.txt. */
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:block;src:url('vendor/fredoka-latin.woff2') format('woff2')}
/* Палитра интерфейса. Цвета мира (--world, --world2) оболочка переписывает из THEMES при старте уровня. */
:root{
  --world:#3d2c63; --world2:#281c45; --ink:#2b2140; --text:#ffffff; --muted:#bfb2e3;
  --good:#3cc65a; --good-d:#1f8a36; --bad:#ef4444; --bad-d:#a62020; --accent:#ffb21f; --accent-d:#c98000;
  --card:#fff8ee; --card-ink:#2b2140; --card-muted:#7d6f9e; --pill:#fffdf8;
  --ui-ink:#4b3b60; --ui-cream:#fffbf4; --ui-lip:#dcc7a6; --good-lip:#25963f; --bad-lip:#b42a2a;   /* v10: мягкий интерфейс — чернила, сливки, «губа» снизу */
  --frame-w:430px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--world2);color:var(--text);font:500 16px/1.25 'Fredoka', system-ui, sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:var(--world);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#game{position:absolute;inset:0;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#game canvas#gl{pointer-events:none}   /* v5: слой жидкого сока (WebGL) поверх поля */
/* v10: интерфейс в тон игрушечной сцене — мягкие кремовые панели, объём «губой» и тенью снизу вместо толстой тёмной обводки,
   тот же шрифт; один стиль для всех наборов арта. HUD — почти ничего: номер уровня мелкой строкой по центру, звук и меню —
   маленькие мягкие кнопки в правом углу. Слой pointer-events:none, кнопки — auto (§9). Прогресс — жёлоб под жерновами (canvas). */
#hud{position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 40px);padding:calc(env(safe-area-inset-top) + 4px) 8px 0;display:flex;
  align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none;z-index:2}
.hud-lvl{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);font-size:15px;font-weight:500;letter-spacing:.03em;
  color:var(--ui-ink);opacity:.78;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.75)}
.hud-lvl b{font-weight:700}
.bump{animation:bump .32s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}  /* стартует с видимого состояния (§9) */
.hud-r{display:flex;gap:7px;margin-left:auto}
.ico{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,251,244,.94);padding:0;
  box-shadow:inset 0 2px 0 #fff,0 2px 0 var(--ui-lip),0 4px 8px rgba(50,35,20,.16);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ico svg{width:19px;height:19px;display:block}
.ico:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #fff,0 0 0 var(--ui-lip),0 2px 4px rgba(50,35,20,.16)}
body.ut #btn-menu{display:none}
/* v13 «лесная мастерская» (3D-вид линейки v11): плашка уровня, кнопки верха и лоток — дерево (фактура --wood13 рисуется кодом) */
body.f13 .hud-lvl{color:#fff4dc;opacity:1;font-weight:600;padding:4px 16px 5px;border-radius:9px;top:calc(env(safe-area-inset-top) + 5px);
  background:var(--wood13) 0 0/170px auto,#bf8249;text-shadow:0 1px 0 rgba(70,32,8,.8);
  box-shadow:inset 0 1.5px 0 rgba(255,228,176,.6),inset 0 -2px 0 rgba(80,38,12,.35),0 3px 0 #6e3c1a,0 6px 10px rgba(16,10,0,.3)}
body.f13 .ico{background:var(--wood13) 30% 0/150px auto,#bf8249;box-shadow:inset 0 1.5px 0 rgba(255,228,176,.6),inset 0 -2px 0 rgba(80,38,12,.3),0 2px 0 #6e3c1a,0 4px 8px rgba(16,10,0,.3)}
body.f13 .ico svg{filter:brightness(0) invert(1) drop-shadow(0 1px 0 rgba(70,32,8,.7))}
body.f13 #tray{background:var(--wood13) 0 0/240px auto,#a96d3c;box-shadow:inset 0 2px 0 rgba(255,228,176,.5),inset 0 -3px 0 rgba(60,28,8,.3),0 5px 0 #5c3116,0 11px 18px rgba(16,10,0,.36)}
body.f13 .wpn{background:linear-gradient(#fbe8c4,#eccd96);box-shadow:inset 0 2px 0 #fff5de,0 4px 0 #9c6b3d,0 6px 10px rgba(40,20,5,.22)}
body.f13 .wpn.empty{background:#8c6440;box-shadow:inset 0 2px 5px rgba(40,18,4,.4)}
body.f13 .wpn.sel{background:linear-gradient(#f4fff1,#d5f6ca);box-shadow:0 0 0 3px var(--good),0 7px 0 var(--good-lip),0 12px 16px rgba(30,100,50,.26)}   /* выбранный — прежняя зелёная рамка */                                   /* v10: сборка для юзер-теста — без выхода в меню */
/* Кнопки объёмные: «губа» снизу своего цвета и мягкая тень, проседают при нажатии; хорошее — зелёным, нежелательное — маленьким красным. */
button{font:inherit;cursor:pointer}
.btn{display:inline-block;font-weight:700;font-size:20px;line-height:1;color:#fff;border:0;border-radius:18px;padding:15px 28px;
  background:linear-gradient(#74e08d,var(--good) 58%,#36b953);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 var(--good-lip),0 9px 16px rgba(30,100,50,.26);
  text-shadow:0 2px 0 rgba(20,95,45,.38)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 1px 0 var(--good-lip),0 3px 6px rgba(30,100,50,.24)}
.btn.big{font-size:24px;padding:17px 32px;min-width:220px}
.btn.plain{background:linear-gradient(#ffffff,#f3eadc);color:var(--ui-ink);text-shadow:none;font-size:17px;padding:12px 20px;
  box-shadow:inset 0 2px 0 #fff,0 4px 0 var(--ui-lip),0 7px 12px rgba(50,35,20,.15)}
.btn.plain:active{box-shadow:inset 0 2px 0 #fff,0 0 0 var(--ui-lip),0 2px 4px rgba(50,35,20,.15)}
.btn.bad{background:linear-gradient(#ff7b7b,var(--bad) 62%);font-size:15px;padding:9px 16px;border-radius:13px;text-shadow:0 1px 0 rgba(120,20,20,.35);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 var(--bad-lip),0 6px 10px rgba(140,30,30,.2)}
.btn.bad:active{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 0 0 var(--bad-lip)}
.btn svg{width:22px;height:22px;vertical-align:-4px;margin-right:6px}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(34,44,68,.4);padding:20px;z-index:3}
#overlay.show{display:flex}
.card{background:linear-gradient(#fffcf6,#fff3e2);color:var(--ui-ink);border:0;border-radius:28px;padding:24px 20px 22px;max-width:340px;width:100%;
  text-align:center;box-shadow:inset 0 2px 0 #fff,0 6px 0 var(--ui-lip),0 20px 44px rgba(28,30,52,.3);animation:pop .22s ease-out}   /* стартует с видимого состояния (§9) */
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.card h2{margin:0 0 8px;font-size:30px;font-weight:700;letter-spacing:.01em}
.card h1{margin:0;font-size:44px;font-weight:700;color:#ffb21f;letter-spacing:.02em;text-shadow:0 3px 0 #e2780f,0 7px 14px rgba(160,80,0,.22)}
.card p{color:var(--card-muted);margin:4px 0 14px;font-size:16px}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:12px 0 8px;max-height:36vh;overflow-y:auto;padding:4px 4px 6px}
.levels button{padding:9px 0;font-size:15px;font-weight:700;color:var(--ui-ink);background:linear-gradient(#fff,#f7f0e5);border:0;border-radius:11px;
  box-shadow:inset 0 1px 0 #fff,0 3px 0 var(--ui-lip),0 4px 8px rgba(50,35,20,.1)}
.levels button.locked{opacity:.4} .levels button.cur{background:linear-gradient(#ffd56e,var(--accent));box-shadow:0 3px 0 var(--accent-d)}
.cheat{margin-top:10px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed rgba(125,111,158,.45);color:var(--card-muted);border-radius:10px}
/* v10: лоток инструментов — кремовая подставка под жёлобом; плитка на инструмент: силуэт (у каждого свой поворот — различимы в сером),
   крупный счётчик; выбранный — приподнят, зелёное кольцо и губа; пустой — утоплен, серый, счётчик серый. */
#tray{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 4px);display:flex;justify-content:center;gap:16px;z-index:2;
  pointer-events:none;padding:7px 12px 6px;border-radius:21px;background:linear-gradient(#5aa6ea,#2f74bf);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(10,40,90,.18),0 5px 0 #1d5592,0 11px 18px rgba(20,40,80,.3)}
/* v11: подставка — синий пластик, как опоры кучи (кремовые кнопки на кремовом сливались); между кнопками 16 px; на узком экране кнопка
   ужимается, чтобы четыре влезали в 360 */
#tray.hide{display:none!important}
.wpn{pointer-events:auto;position:relative;width:min(74px,calc((100vw - 96px) / 4));height:50px;border-radius:16px;border:0;background:linear-gradient(#ffffff,#f3ebdf);
  box-shadow:inset 0 2px 0 #fff,0 4px 0 #d3bf9f,0 6px 10px rgba(50,35,20,.14);padding:0;display:flex;align-items:center;justify-content:center;transition:transform .12s}
/* v12 круг 5: касание — вся ячейка подставки (поля и половина промежутка), скруглённые углы кнопки не проваливаются в поле */
.wpn::after{content:'';position:absolute;inset:-8px -9px -7px -9px;border-radius:18px}
.wpn.sel::after{inset:-3px -9px -12px -9px}
.wpn b{position:absolute;right:-7px;top:-8px;min-width:30px;height:30px;border-radius:15px;background:var(--ui-ink);color:#fff;font-size:19px;line-height:30px;
  padding:0 6px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.wpn.sel{background:linear-gradient(#f4fff1,#d5f6ca);transform:translateY(-5px);box-shadow:0 0 0 3px var(--good),0 7px 0 var(--good-lip),0 12px 16px rgba(30,100,50,.26)}
.wpn.sel b{background:var(--good)}
.wpn.empty{background:#a9c3dd;box-shadow:inset 0 2px 5px rgba(10,40,90,.25);transform:translateY(2px)}
.wpn.empty img{filter:grayscale(1);opacity:.32}
.wpn.empty b{background:#bdb5c3}
/* v11: рука-подсказка над кнопкой лотка: выбран не тот инструмент — палец жмёт нужный */
.thand{position:absolute;left:50%;top:38%;width:44px;height:67px;margin-left:-14px;pointer-events:none;z-index:3;background:var(--hu) no-repeat 0 0/contain;
  filter:drop-shadow(3px 5px 0 rgba(30,24,60,.22));animation:thand 1.1s ease-in-out infinite;transform-origin:30% 0}
@keyframes thand{0%,100%{transform:translateY(-12px) rotate(-12deg)}40%,62%{transform:translateY(0) rotate(-12deg) scale(.96);background-image:var(--hp)}}
/* силуэт инструмента: свой поворот и размер — нож длинный узкий по диагонали, топор стоймя (широкая голова сверху), пила лёжа, булава шаром вверх */
.tool img{display:block;object-fit:contain;pointer-events:none}
.tool[data-w=knife] img{width:68px;height:22px;transform:rotate(-28deg)}
.tool[data-w=axe] img{width:58px;height:30px;transform:rotate(-80deg)}
.tool[data-w=saw] img{width:66px;height:34px;transform:rotate(-8deg)}
.tool[data-w=mace] img{width:62px;height:34px;transform:rotate(-48deg)}
/* v10: «How to play» — четыре строки «плитка инструмента — слово» */
.howto{display:grid;gap:11px;margin:16px auto 20px;width:max-content}
.howto div{display:flex;align-items:center;gap:16px}
.howto .ti{width:74px;height:60px;border-radius:17px;background:linear-gradient(#fff,#f3ebdf);box-shadow:inset 0 2px 0 #fff,0 4px 0 #d3bf9f,0 6px 10px rgba(50,35,20,.12);
  display:flex;align-items:center;justify-content:center}
.howto b{font-size:27px;font-weight:700;min-width:118px;text-align:left}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;
  border-radius:12px;pointer-events:none;opacity:.96;transition:opacity .25s;white-space:nowrap;z-index:4}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card,.bump{animation:none} #toast{transition:none} }
</style>

<script>
'use strict';
/* ЯДРО */
// =====================================================================================================
// Pulp Drop — ядро. Взмах режет кучу фруктов, куски падают в жернова, сок наполняет бак.
// Физика — planck.js 1.4.2 (порт Box2D), vendor/planck.js: в браузере глобальный `planck`, в node его подаёт
// core-load.mjs. Ядро без DOM и без Math.random (в planck Math.random есть только в утилите math.random,
// на пути симуляции её нет — проверяет test.mjs). Случайность — mulberry32 с сидом от номера уровня.

// у предмета кучи есть поле tag (flags.tag тела), у детали — свой тип в parts; события explode / crack / rope
// зарезервированы (см. drainEvents).
// =====================================================================================================

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------------ геометрия выпуклых многоугольников
// Вершины — массивы [x, y]; обход с положительной площадью по формуле шнурков (в осях y-вниз).
function polyArea(V){
  let s = 0;
  for (let i = 0, n = V.length; i < n; i++){ const p = V[i], q = V[(i + 1) % n]; s += p[0] * q[1] - q[0] * p[1]; }
  return s / 2;
}
function polyCentroid(V){
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = V.length; i < n; i++){
    const p = V[i], q = V[(i + 1) % n], cr = p[0] * q[1] - q[0] * p[1];
    a += cr; cx += (p[0] + q[0]) * cr; cy += (p[1] + q[1]) * cr;
  }
  a /= 2;
  return Math.abs(a) < 1e-12 ? [V[0][0], V[0][1]] : [cx / (6 * a), cy / (6 * a)];
}
function polyRadius(V){ let r = 0; for (const v of V) r = Math.max(r, Math.hypot(v[0], v[1])); return r; }
// Толщина: наименьшая по рёбрам «высота» многоугольника над ребром. Щепка тоньше CFG.minThick — брызги.
function polyThick(V){
  let best = Infinity;
  for (let i = 0, n = V.length; i < n; i++){
    const p = V[i], q = V[(i + 1) % n], ex = q[0] - p[0], ey = q[1] - p[1], L = Math.hypot(ex, ey);
    if (L < 1e-9) continue;
    let h = 0;
    for (const v of V){ const d = Math.abs((v[0] - p[0]) * ey - (v[1] - p[1]) * ex) / L; if (d > h) h = d; }
    if (h < best) best = h;
  }
  return best;
}
// Выпуклая оболочка (монотонная цепь), обход с положительной площадью.
function convexHull(P){
  const pts = P.map(p => [p[0], p[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts){ while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--){ const p = pts[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  up.pop(); lo.pop();
  const h = lo.concat(up);
  return polyArea(h) < 0 ? h.reverse() : h;
}
// Пересечение отрезка a→b с выпуклым многоугольником: параметры входа и выхода [t0, t1] по прямой (без обрезки
// по [0,1]) или null. «Насквозь» — когда 0 < t0 < t1 < 1: оба конца лезвия снаружи тела.
function clipChord(V, ax, ay, bx, by){
  const n = V.length, dx = bx - ax, dy = by - ay, sg = polyArea(V) >= 0 ? 1 : -1;
  let t0 = -Infinity, t1 = Infinity;
  for (let i = 0; i < n; i++){
    const p = V[i], q = V[(i + 1) % n], ex = q[0] - p[0], ey = q[1] - p[1];
    const nx = sg * ey, ny = -sg * ex;                          // наружная нормаль ребра
    const num = nx * (p[0] - ax) + ny * (p[1] - ay), den = nx * dx + ny * dy;
    if (den === 0){ if (num < 0) return null; continue; }
    const t = num / den;
    if (den < 0){ if (t > t0) t0 = t; } else if (t < t1) t1 = t;
    if (t0 > t1) return null;
  }
  return [t0, t1];
}
// Разрез многоугольника прямой (точка p, нормаль n). F[i] — ребро i→i+1 является срезом.
// Возвращает { A, B }: A — сторона d ≥ 0, B — d < 0; каждая { V, F } или null. Новые рёбра по линии — срезы.
function splitPoly(V, F, px, py, nx, ny){
  const n = V.length, d = new Array(n);
  for (let i = 0; i < n; i++) d[i] = (V[i][0] - px) * nx + (V[i][1] - py) * ny;
  const A = [], AF = [], B = [], BF = [];
  for (let i = 0; i < n; i++){
    const j = (i + 1) % n, vi = V[i], vj = V[j], di = d[i], dj = d[j];
    if (di >= 0){ A.push(vi); AF.push(F[i]); } else { B.push(vi); BF.push(F[i]); }
    if ((di >= 0) !== (dj >= 0)){
      const t = di / (di - dj), I = [vi[0] + (vj[0] - vi[0]) * t, vi[1] + (vj[1] - vi[1]) * t];
      if (di >= 0){ A.push(I); AF.push(true); B.push(I); BF.push(F[i]); }   // выход из A: дальше по линии реза
      else { B.push(I); BF.push(true); A.push(I); AF.push(F[i]); }            // вход в A: дальше по старому ребру
    }
  }
  return { A: A.length >= 3 ? { V: A, F: AF } : null, B: B.length >= 3 ? { V: B, F: BF } : null };
}
// Чистка куска: слить близкие вершины, убрать почти прямые углы, не больше CFG.maxVerts вершин
// (убирается вершина с наименьшим треугольником — площадь теряется чуть-чуть). null — кусок выродился.
function cleanPoly(V, F){
  V = V.slice(); F = F.slice();
  const tri = (i) => { const n = V.length, a = V[(i + n - 1) % n], b = V[i], c = V[(i + 1) % n];
    return Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0])) / 2; };
  const dropVertex = (i) => {               // вершина i уходит, рёбра i-1 и i сливаются; флаг — у более длинного
    const n = V.length, h = (i + n - 1) % n, a = V[h], b = V[i], c = V[(i + 1) % n];
    const keepCut = Math.hypot(b[0] - a[0], b[1] - a[1]) >= Math.hypot(c[0] - b[0], c[1] - b[1]) ? F[h] : F[i];
    F[h] = keepCut; V.splice(i, 1); F.splice(i, 1);
  };
  for (let guard = 0; guard < 64 && V.length >= 3; guard++){
    let k = -1;
    for (let i = 0; i < V.length; i++){
      const j = (i + 1) % V.length;
      if (Math.hypot(V[j][0] - V[i][0], V[j][1] - V[i][1]) < CFG.minEdge){ k = j; break; }
    }
    if (k < 0) for (let i = 0; i < V.length; i++) if (tri(i) < 0.05){ k = i; break; }
    if (k < 0 && V.length > CFG.maxVerts){ let m = Infinity; for (let i = 0; i < V.length; i++){ const t = tri(i); if (t < m){ m = t; k = i; } } }
    if (k < 0) break;
    dropVertex(k);
  }
  return V.length >= 3 && polyArea(V) > 0 ? { V, F } : null;
}

    for (let k = 0; k < m; k++){ const a = (k + 0.5) * 2 * Math.PI / m, c = Math.cos(a), s = Math.sin(a);

    for (let k = 0; k < 6; k++){ const a = -Math.PI / 2 + k * Math.PI / 5; P.push([cx + r * Math.cos(a), r * Math.sin(a)]); }

    const [, xw, xe, y, tilt, lip] = p, th = 12, dir = Math.sign(xe - xw), len = Math.abs(xe - xw);
    const drop = len * Math.tan(tilt * Math.PI / 180), ye = y + drop;

    if (lip > 0) out.push({ role: 'shelf', poly: convexHull([[xe - dir * 10, ye - lip], [xe, ye - lip], [xe, ye + th], [xe - dir * 10, ye + th]]) });
  } else if (p[0] === 'neck'){
    const [, y, w, h] = p, x1 = (W - w) / 2;
    out.push({ role: 'neck', poly: convexHull([[0, y - h], [x1, y], [0, y + h]]) });
    out.push({ role: 'neck', poly: convexHull([[W, y - h], [W - x1, y], [W, y + h]]) });
  } else if (p[0] === 'block'){
    const [, x0, y0, x1, y1] = p;
    out.push({ role: 'block', poly: convexHull([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]) });
  } else if (p[0] === 'gate'){
    const G = gateShape(p); for (const P of G.local) out.push({ role: 'gate', dyn: true, poly: placeLocal(P, G.hinge, 0) });
  } else if (p[0] === 'spin'){
    const S = spinShape(p); for (const P of S.local) out.push({ role: 'spin', dyn: true, poly: placeLocal(P, S.c, 0) });
  } else if (p[0] === 'bin'){
    const [, gx, gy2, gw, xl, xr, k, t0] = p, t = t0 || 16, a = gx - gw / 2, b = gx + gw / 2;

  } else if (p[0] === 'net'){                         // v4: звенья авоськи

  } else if (p[0] === 'plank'){
    const P = plankShape(p); for (const Q of P.local) out.push({ role: 'plank', dyn: true, poly: placeLocal(Q, P.c, 0) });
  } else if (p[0] === 'branch'){                      // v4: ветка — толстая плита от (x0, y0) до (x1, y1)

}
// ------------------------------------------------------------------ v4: решётка, сетка, доска на двух верёвках, гроздь
//   ['grate', x0, y0, x1, y1, gap, r]   решётка: прутья радиуса r (по умолчанию CFG.rodR) вдоль отрезка, просвет между
//                                       соседними — gap. Тело проходит сквозь прутья, если его наименьшая ширина
//                                       меньше gap − CFG.grateSlack (pre-solve выключает контакт): целый не пролезет,
//                                       половинка — проскочит
//   ['net', cx, y0, w, h, hole]         сетка-авоська: дуга из CFG.netSegs звеньев от левого края горловины (cx − w/2, y0)
//                                       через дно (cx, y0 + h) к правому; рез звена выбивает дыру шириной hole
//   ['plank', x0, x1, y, hookY, ridge]  доска на двух верёвках: верх доски на y, верёвки от крюков (x0 + 8, hookY) и
//                                       (x1 − 8, hookY) к её концам; ridge — x бортика-перегородки (null — нет)
//   ['vine', ax, ay, knots]             гроздь: крюк (ax, ay), черенок вниз через узлы knots = [[dx, dy, fruits], …] —
//                                       узел i в (узел i−1) + (dx, dy); fruits = [[вид, масштаб, dx, dy, tag], …] висят на
//                                       своих черенках от узла (центр фрукта — узел + (dx, dy)). Рез черенка между узлами
//                                       роняет всё ниже; рез черенка фрукта — один фрукт
//   ['branch', x0, y0, x1, y1, t]       ветка (статичная толстая плита)
function grateRods(p){
  const [, x0, y0, x1, y1, gap, r0] = p, r = r0 || CFG.rodR, L = Math.hypot(x1 - x0, y1 - y0), pitch = gap + 2 * r, n = Math.floor(L / pitch + 1e-6) + 1, out = [];
  const ux = (x1 - x0) / L, uy = (y1 - y0) / L, off = (L - (n - 1) * pitch) / 2;
  for (let k = 0; k < n; k++){ const t = off + k * pitch; out.push([x0 + ux * t, y0 + uy * t, r]); }
  return out;
}
// Середины просветов решётки (куда класть фрукт, чтобы он лёг на два прута).
function grateGaps(p){ const R = grateRods(p), out = []; for (let k = 0; k + 1 < R.length; k++) out.push([(R[k][0] + R[k + 1][0]) / 2, (R[k][1] + R[k + 1][1]) / 2]); return out; }

  const box = (a, b, c0, d) => convexHull([[a, b], [c0, b], [c0, d], [a, d]]);
  const local = [box(-hw, -T / 2, hw, T / 2)];
  if (ridge != null) local.push(box(ridge - c[0] - 5, -T / 2 - 24, ridge - c[0] + 5, -T / 2));
  local.push(box(-hw, -T / 2 - 6, -hw + 6, -T / 2), box(hw - 6, -T / 2 - 6, hw, -T / 2));   // низкие бортики по краям: целое не скатится само, на наклоне перекатится
  return { c, local, ends: [[-hw + 7, -T / 2], [hw - 7, -T / 2]], hooks: [[x0 + 8, hookY], [x1 - 8, hookY]] };

function plateQuad(x0, y0, x1, y1, t){

// Расстояние от точки до выпуклого многоугольника (0 — внутри).
function polyDist(P, x, y){

    if ((x - a[0]) * ey - (y - a[1]) * ex > 0) inside = false;
    const t = L2 ? Math.max(0, Math.min(1, ((x - a[0]) * ex + (y - a[1]) * ey) / L2)) : 0;
    best = Math.min(best, Math.hypot(a[0] + ex * t - x, a[1] + ey * t - y));
  }
  return inside ? 0 : best;
}

function partGaps(parts){

    if (p[0] === 'funnel') g.push({ x: p[1], y: CFG.floorY - (p[4] || CFG.slotH), w: p[2] });

// v5. Куча на решётке. Чаша — профиль дна от левой стеклянной стенки до правой: точки [[x, y], …] и тип каждого отрезка
// ('S' — глухая стенка толщиной CFG.bowlT снаружи профиля, 'G' — решётка: прутья CFG.bowlRod, просвет ≤ CFG.bowlGap, прут —
// ровно на каждом конце отрезка, без щели на стыке со стенкой). Раскрывается в детали 'poly' и 'grate' — решётка та же, что в v4:
// проходит то, что тоньше просвета (целый фрукт лежит, половинка проскакивает). Глухие отрезки — круче 15°: мокрый кусок по ним
// съезжает к решётке и не залёживается (форма вместо невидимых правил).
function BOWL(pts, types, t){
  const out = [], T = t || CFG.bowlT, r = CFG.bowlRod;

    if (types[i] === 'G'){ const n = Math.max(2, Math.round(L / (CFG.bowlGap + 2 * r)) + 1), gap = L / (n - 1) - 2 * r - 1e-6;   // окно — кратно шагу 50
      out.push(['grate', a[0], a[1], b[0], b[1], gap, r]); continue; }
    const nx = dy / L, ny = -dx / L;                         // нормаль внутрь чаши (обход слева направо, ось y вниз)
    out.push(['poly', [a, b, [b[0] - nx * T, b[1] - ny * T], [a[0] - nx * T, a[1] - ny * T]]]);
  }
  out.profile = { pts, types };                              // для вида: тело чаши под глухими стенками
  return out;
}

// (шаг полфрукта: соседние ряды смещены на полшага — укладка «сотами»). Каждый фрукт падает в свою колонку (окно ±r+3) и
// ложится на то, что под ним; дальше доосадка физикой. Метки: вкус + номер (R1, R2…) — для решений и отладки.
// Фрукты одного калибра (радиус ≈ 23) — куча читается мозаикой; арбуз — редкий крупный гость (радиус ≈ 40).
const PILE5 = { R: ['berry', 1.4], G: ['lime', 1.2], Y: ['lemon', 1.24], P: ['plum', 1.15], O: ['orange', 0.85], M: ['melon', 0.86] };   // наименьшая ширина 42–45; арбуз — 2 калибра
function HEAP(rows, x0, step){
  const out = [], cnt = {}, st = step || 24;
  rows.forEach((row, ri) => { for (let i = 0; i < row.length; i++){ const ch = row[i], k = PILE5[ch]; if (!k) continue;
    cnt[ch] = (cnt[ch] || 0) + 1; const x = x0 + i * st, r = polyRadius(kindVerts(k[0], k[1]));
    const ang = k[0] === 'berry' ? ((i * 37 + ri * 61) % 50 - 25) : k[0] === 'lemon' ? ((i * 29 + ri * 13) % 24 - 12) : 0;
    out.push([k[0], x, k[1], ang, ch + cnt[ch], null, x - r - 3, x + r + 3]); } });
  return out;
}

// Бюджет ходов. Таблица 1–60 запечена командой `node sim.mjs calibrate --write` (умный бот × запас по зубцу пилы);
// дальше — формула budgetFormula. Не править руками: перезапусти калибровку после правки генератора.
// BUDGETS-BEGIN
const BUDGETS = [0,
  3, 3, 4, 4, 4, 7, 3, 9, 7, 13,
  3, 9, 7, 2, 5, 2, 5, 2, 4, 9,
  7, 4, 6, 5, 3, 5, 3, 5, 5, 3,
  6, 4, 4, 8, 8, 3, 6, 2, 2, 6,
  10, 3, 4, 7, 4, 4, 11, 6, 4, 7,
  7, 2, 13, 2, 3, 11, 5, 5, 8, 8];
// BUDGETS-END
// Зубец пилы: после 20-го уровня — лёгкий / средний / сложный по кругу; 11–20 — лёгкие, каждый пятый средний.
function levelTier(n){ if (n <= 10) return 0; if (n <= 20) return n % 5 === 0 ? 1 : 0; return (n - 21) % 3; }
// Формула бюджета для уровней за таблицей: база по зубцу пилы + «работа» (пробки, арки, лишние арбузы) + мелочь.
// base — 90-й перцентиль остатка по таблице калибровки (с запасом); пишет `node sim.mjs calibrate --write`.
// w — ходов на единицу признака: пробки, арки, лишние крупные, особые предметы (скорлупа, ляда, вертушка, перец).
const BUDGET_FIT = { base: [-0.7, -1.1, -0.9], w: { plugs: 1.28, arch: 0.5, big: 0.14, shell: 0.54, rope: 0, spin: -1.23, bomb: -0.28 }, small: 0.122 };
function budgetFormula(L){
  const f = L.feat || { plugs: 1, arch: 0, big: 0, small: 10 }, B = BUDGET_FIT;
  let w = B.base[L.tier || 0] + B.small * (f.small || 0);
  for (const k in B.w) w += B.w[k] * (f[k] || 0);
  return Math.max(3, Math.round(w));
}

// Ручки генератора по зубцу пилы [лёгкий, средний, сложный]. Сложность — формой короба и особыми предметами, не числом

const GEN = {

          ['', 'pegs', 'shelf', 'neck', 'pegs'],

  gapV: [[116, 130], [102, 116], [88, 102]],  // ширина V-щели («арка»): ≈ 2–2,6 яблока, чтобы мелочь не вставала аркой
  gapP: [[110, 122], [100, 112], [90, 100]],  // ширина щели-кармана у стенки
  plugs: [[1, 1], [1, 2], [2, 3]],          // «пробок» над щелью (крупный круглый или «длинный» поперёк V-щели)
  fillers: [[18, 24], [24, 30], [28, 36]],  // наполнитель — средние и мелкие фрукты
  big: [[1, 1], [1, 2], [2, 3]],            // лишних крупных среди наполнителя — их надо дорезать до щели
  bigLow: 0.35,                             // лишние крупные — в нижней трети наполнителя (выбор исполнителя, этап 3: дальние
                                            // арбузы наверху кучи давали новичку подготовительные резы без сока)
  slope: [0.75, 0.95],                      // крутизна клиньев воронки (≥ 37°: куски с мокрым срезом не залёживаются)
  pegClear: 120,                            // проход между штырём и деталями/другим штырём: шире половинки арбуза
  shelfTilt: [20, 26],                      // полка-отбойник: наклон°, без бортика — держит кучу, пока её подпирают снизу
  intro: { bomb: 12, shell: 22, rope: 32, spin: 42 },   // уровень-знакомство (INTRO); после него предмет берёт генератор
  spec: [[0.35, 1], [0.6, 1], [0.85, 2]],   // особые предметы: вероятность хотя бы одного и максимум, по пиле
  specFresh: 10,                            // столько уровней после знакомства предмет выпадает втрое чаще
  spinClear: 46,                            // вертушка: зазор от конца лопасти до деталей и стенок (фрукт не зажмёт)
};
// Генератор уровня n ≥ 11 (и любого n — для проверок). Детерминирован по (n, attempt). Вариант, в котором при раскладке
// не лёг крупный предмет (пробка, «длинный», кокос, перец) или выпало больше 15% кучи, отбрасывается — берётся следующий
// вариант того же сида (до 8).
function genLevel(n, attempt){
  let L = null;
  for (let k = 0; k < 8; k++){

    if (layoutOk(L)) return L;

function layoutOk(L){
  const TH = THEMES[L.theme], big = (k) => k === TH.plug || k === TH.long || k === 'coco' || k === 'pepper';
  const polys = [], dyn = [];
  for (const p of L.parts) for (const st of partPolys(p)) (st.dyn ? dyn : polys).push(st.poly);
  const pile = expandPile(L.pile), placed = placePile(L, polys.concat(dyn), partGaps(L.parts));

}
function genVariant(n, attempt){

  const U = (a, b) => a + (b - a) * r(), I = (a, b) => Math.floor(U(a, b + 1 - 1e-9)), pick = (arr) => arr[Math.floor(r() * arr.length)];
  const tier = levelTier(n), W = CFG.W, theme = themeFor(n), TH = THEMES[theme];
  // особые предметы по номеру: открытые до n, свежий — втрое чаще
  const open = Object.keys(GEN.intro).filter(k => GEN.intro[k] < n);
  const specials = [];
  if (open.length && r() < GEN.spec[tier][0]){
    const want = GEN.spec[tier][1] > 1 && r() < 0.4 ? 2 : 1;
    for (let k = 0; k < want; k++){
      const pool = []; for (const sp of open) if (!specials.includes(sp)) for (let w = 0; w < (n - GEN.intro[sp] <= GEN.specFresh ? 3 : 1); w++) pool.push(sp);
      if (pool.length) specials.push(pick(pool));

  const hasRope = specials.includes('rope'), hasSpin = specials.includes('spin');
  let base = pick(GEN.base[tier].filter(t => n >= 15 || t !== 'twin'));
  let addon = pick(GEN.addon[tier].filter(a => (n >= 15 || !['shelf', 'neck', 'divider', 'pegs+shelf'].includes(a)) && (a !== 'divider' || base === 'twin')
    && !((hasRope || hasSpin) && (a === 'neck' || a.includes('shelf') || a.includes('pegs')))));   // штырь под лядой держал бы доску
  if (addon === undefined) addon = '';
  const k = +U(GEN.slope[0], GEN.slope[1]).toFixed(2);
  const pocket = base === 'pocket' || (base !== 'twin' && base !== 'offset' && addon !== '' && addon !== 'divider' && r() < 0.5);
  const gw = Math.round(pocket ? U(GEN.gapP[tier][0], GEN.gapP[tier][1]) : U(GEN.gapV[tier][0], GEN.gapV[tier][1]));
  const parts = [], pile = [];
  let gaps;
  if (base === 'twin') gaps = [Math.round(U(100, 135)), Math.round(W - U(100, 135))];
  else if (pocket) gaps = [r() < 0.5 ? gw / 2 : W - gw / 2];
  else gaps = [base === 'offset' ? Math.round(r() < 0.5 ? U(120, 150) : U(250, 280)) : Math.round(U(180, 220))];
  const gwFor = base === 'twin' ? gw - 4 : gw;

    } else if (specials.includes('shell') && !shell){                 // скорлупа: первая круглая пробка — кокос того же размера

    } else {

      const free = polys.every(P => polyDist(P, x, y) >= GEN.pegClear + rr) && pegs.every(q => Math.hypot(q[1] - x, q[2] - y) >= GEN.pegClear + rr + q[3]);

  if (addon === 'divider'){   // две камеры: перегородка на коньке крыши между щелями
    const roof = partPolys(parts[0]).find(st => st.role === 'roof'), top = Math.min(...roof.poly.map(v => v[1]));

  // plugTop); пробки сыплются из-под лопастей (fromY ниже начальной позы вертушки)
  if (hasSpin){
    const polys = staticPolys().concat(gate ? partPolys(parts[parts.length - 1]).map(st => st.poly) : []);
    const plugTop = Math.min(...pile.map(it => CFG.floorY - CFG.plugClear - 2 * polyRadius(kindVerts(it[0], it[2]))));
    let ok = null;
    for (let t = 0; t < 40 && !ok; t++){
      const L = Math.round(U(62, 84)), x = Math.round(U(120, 280)), y = Math.round(U(gate ? 360 : 310, Math.min(420, plugTop - 14 - L))), arms = tier === 2 && r() < 0.3 ? 3 : r() < 0.6 ? 4 : 2;
      if (x - L < GEN.spinClear || x + L > W - GEN.spinClear || y + L > plugTop - 14) continue;

      if (polys.every(P => polyDist(P, x, y) >= L + GEN.spinClear)) ok = ['spin', x, y, L, arms, r() < 0.5 ? 1 : -1, arms === 4 ? +(Math.PI / 4).toFixed(4) : arms === 3 ? +(-Math.PI / 2).toFixed(4) : 0];

  for (let i = 0; i < bombs; i++){

// Цель одна — пропихнуть всю кучу в жернова. Куча лежит на клиньях и полках со щелями (детали v1–v3: funnel, twin, bin, shelf,
// plate, peg); пролезает то, что уже щели. Помехи: крупное (шире щели), твёрдое (кокос: нож отскакивает, пила глохнет), длинное
// (огурец поперёк щели), затор (мелочь аркой над щелью), плотная куча. Инструменты — CFG.WEAPONS7, у каждого один глагол.
const isHard = (b) => !!KINDS[b.kind].hard && !b.flags.cut && !b.flags.chew;
// Где нож или пила на отрезке (ax, ay) → (bx, by) упирается в твёрдое (ось ножа; у пилы — полотно шириной kerfW): { b, t, x, y } или null.
function hardOnSeg(s, F, W, ax, ay, bx, by){
  const thr = W.hardStop === 'stall' ? W.kerfW / 2 : 0.5, L = Math.hypot(bx - ax, by - ay), H = [];
  for (const b of s.bodies) if (isHard(b) && !(F && F.skip.has(b.id)) && segPtDist(ax, ay, bx, by, b.x, b.y) <= b.rad + thr + 1) H.push(b);
  if (!H.length) return null;
  const n = Math.max(1, Math.ceil(L / 2));
  for (let k = 0; k <= n; k++){ const t = k / n, x = ax + (bx - ax) * t, y = ay + (by - ay) * t;
    for (const b of H){ const l = toLocal(b, x, y); if (polyDist(b.verts, l[0], l[1]) <= thr) return { b, t, x, y }; } }
  return null;
}
// То же по всей траектории (предпросмотр): { b, d, p } — где по длине пути упрётся.
function hardStopAt(s, W, path, skip){
  let acc = 0;
  for (let i = 1; i < path.length; i++){ const a = path[i - 1], c = path[i], L = Math.hypot(c[0] - a[0], c[1] - a[1]);
    const h = hardOnSeg(s, { skip }, W, a[0], a[1], c[0], c[1]); if (h) return { b: h.b, d: acc + L * h.t, p: [h.x, h.y] }; acc += L; }
  return null;
}
// Траектория, обрезанная на длине d (≥ 2 точки), или null.
function cutPath(path, d){
  if (d < 1) return null; const out = [path[0]]; let acc = 0;
  for (let i = 1; i < path.length; i++){ const a = path[i - 1], c = path[i], L = Math.hypot(c[0] - a[0], c[1] - a[1]);
    if (acc + L >= d){ const f = L ? (d - acc) / L : 0; out.push([a[0] + (c[0] - a[0]) * f, a[1] + (c[1] - a[1]) * f]); return out; }
    out.push(c); acc += L; }
  return out;
}
// Нож отскочил от твёрдого / пила заглохла: полёт кончен; если бросок ничего не разрезал — инструмент возвращается (не тратится).
// Кокос вздрагивает от удара.
function hardStop(s, F, W, b, x, y, ux, uy){
  F.done = true; F.stuckId = null;
  const refund = !F.free && F.cuts === 0;
  if (refund){ s.ammo[F.w] = (s.ammo[F.w] || 0) + 1; s.moves++; s.used--; if (s.weapon !== F.w){ s.weapon = F.w; ev(s, { type: 'weapon', w: F.w, auto: true }); }
    if (s.cutWin) s.cutWin.free = true; }
  F.bounce = { id: b.id, x: +x.toFixed(1), y: +y.toFixed(1), how: W.hardStop, refund };
  const v = b.pb.getLinearVelocity(); b.pb.setAwake(true); b.pb.setLinearVelocity(planck.Vec2(v.x + ux * 25 / CFG.ppm, v.y + uy * 25 / CFG.ppm - 20 / CFG.ppm));
  ev(s, { type: 'bounce', w: F.w, how: W.hardStop, id: b.id, kind: b.kind, x: +x.toFixed(1), y: +y.toFixed(1), ux: +ux.toFixed(3), uy: +uy.toFixed(3), free: !!F.free || refund });
}
// Булава: летит до первого касания (голова r), центр удара — на dip глубже по ходу; всё, что ближе R к центру, — в осколки.
function maceImpact(s, W, a, c, skip){
  const L = Math.hypot(c[0] - a[0], c[1] - a[1]), ux = (c[0] - a[0]) / (L || 1), uy = (c[1] - a[1]) / (L || 1), n = Math.max(1, Math.ceil(L / 3));
  for (let k = 0; k <= n; k++){ const px = a[0] + (c[0] - a[0]) * k / n, py = a[1] + (c[1] - a[1]) * k / n;
    for (const b of s.bodies){ if (b.flags.chew || (skip && skip.has(b.id)) || Math.hypot(b.x - px, b.y - py) > b.rad + W.r) continue;
      const l = toLocal(b, px, py); if (polyDist(b.verts, l[0], l[1]) > W.r) continue;
      const dx = b.x - px, dy = b.y - py, dd = Math.hypot(dx, dy) || 1, m = Math.min(dd, W.dip);   // центр удара — внутри задетого тела
      return { px, py, cx: px + dx / dd * m, cy: py + dy / dd * m, ux, uy, d: L * k / n }; } }
  return null;
}
function maceTargets(s, W, cx, cy, skip){
  const out = [];
  for (const b of s.bodies){ if (b.flags.chew || (skip && skip.has(b.id)) || Math.hypot(b.x - cx, b.y - cy) > b.rad + W.R) continue;
    const l = toLocal(b, cx, cy), d = polyDist(b.verts, l[0], l[1]); if (d <= W.R) out.push({ b, d }); }
  return out.sort((p, q) => p.d - q.d);
}
function macePreview(s, W, path, skip, out){
  const a = path[0], c = path[path.length - 1], I = maceImpact(s, W, a, c, skip); if (!I) return { hits: out, end: c };
  for (const t of maceTargets(s, W, I.cx, I.cy, skip)) out.push({ id: t.b.id, how: 'smash', p: [I.cx, I.cy], q: [I.cx, I.cy], d: I.d, m: +(W.R - t.d).toFixed(1) });
  return { hits: out, end: [I.px, I.py], ring: { x: +I.cx.toFixed(1), y: +I.cy.toFixed(1), R: W.R } };
}
function smashCircle(s, F, W, px, py, ux, uy){
  const I = maceImpact(s, W, [px - ux * 4, py - uy * 4], [px + ux * 4, py + uy * 4], F.skip), cx = I ? I.cx : px + ux * W.dip, cy = I ? I.cy : py + uy * W.dip, T = maceTargets(s, W, cx, cy, F.skip);
  F.noShake = true;
  for (const t of T){ if (!s.bodies.includes(t.b)) continue; F.hit.add(t.b.id); F.hits++; if (KINDS[t.b.kind].special === 'bomb') detonate(s, t.b, 0); else smash(s, F, W, t.b, cx, cy, ux, uy); F.cuts++; }
  F.noShake = false; F.done = true; F.slow *= W.slow;
  shakePile(s, cx, cy, W.shakeR, W.shakeV, F.skip);
  ev(s, { type: 'mace', x: +cx.toFixed(1), y: +cy.toFixed(1), R: W.R, n: T.length });
}
// Сколько кучи осталось: тела + сок, что едет с ними.
function heapLeft(s){ let a = 0; for (const b of s.bodies) a += b.area + (b.juiceX || 0); return a; }
// Осталось меньше CFG.sweepAt — победа, остатки проваливаются сквозь детали в жернова (чтобы не добивать крошки).
function clearCheck(s){
  if (heapLeft(s) > CFG.sweepAt * s.total) return false;
  s.won = true; s.swept = true; s.winUsed = s.used; s.winPeak = s.peakNet;
  let a = 0; const n = s.bodies.length;
  for (const b of s.bodies){ a += b.area; b.flags.swept = true;
    for (let f = b.pb.getFixtureList(); f; f = f.getNext()) f.setFilterMaskBits(0);
    const v = b.pb.getLinearVelocity(); b.pb.setAwake(true); b.pb.setLinearVelocity(planck.Vec2(v.x * 0.3, Math.max(v.y, 90 / CFG.ppm))); }
  ev(s, { type: 'sweep', n, area: +a.toFixed(0), share: +(a / s.total).toFixed(3) });
  ev(s, { type: 'win', juice: +(s.juice / s.total).toFixed(3), moves: s.moves, sweep: n > 0 });
  return true;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOutBack = (p) => { const c = 1.25; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

// =====================================================================================================
// Звук: WebAudio-синтез без файлов (§8). Шины: эффекты (sfx) и музыка (mus) → мастер → компрессор.
// Ленивый старт по первому жесту (иначе iOS молчит). Каждый звук — строка `sound` в журнале.
// =====================================================================================================
// Громкость: шина эффектов, музыка — MUSIC.vol; шум после узкого фильтра теряет энергию — поднят noiseBoost.
const SND = { sfx: 1.5, noiseBoost: 3 };
const Sound = {
  ac: null, master: null, sfx: null, mus: null, noiseBuf: null, rl: {}, motor: null, motorAt: 0, saw: null,
  init(){
    if (this.ac){ if (this.ac.state === 'suspended' && !G.paused) this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; return; }
    const ac = this.ac;
    this.master = ac.createGain(); this.master.gain.value = G.save.muted ? 0 : 1;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.master.connect(comp).connect(ac.destination);
    this.sfx = ac.createGain(); this.sfx.gain.value = SND.sfx; this.sfx.connect(this.master);
    this.mus = ac.createGain(); this.mus.gain.value = MUSIC.vol; this.mus.connect(this.master);
    const n = ac.sampleRate, buf = ac.createBuffer(1, n, n), d = buf.getChannelData(0), r = mulberry32(777);   // шум из mulberry32
    for (let i = 0; i < n; i++) d[i] = r() * 2 - 1;
    this.noiseBuf = buf;
    log('sound', 'init', ac.sampleRate);
    if (G.s) this.motorOn();
    Music.start();
  },
  setMuted(m){ if (this.ac) this.master.gain.setTargetAtTime(m ? 0 : 1, this.ac.currentTime, 0.03); },
  // тон: осциллятор type, частота f0→f1 за dur, громкость v, атака a
  tone(t, type, f0, f1, dur, v, bus, a){
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + (a || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(bus || this.sfx); o.start(t); o.stop(t + dur + 0.03);
  },
  // шум через фильтр ftype с частотой f0→f1 и добротностью q
  noise(t, ftype, f0, f1, q, dur, v, bus, a){
    const ac = this.ac, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noiseBuf; src.loop = true;
    f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v * SND.noiseBoost), t + (a || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(bus || this.sfx); src.start(t, (t * 7.31) % 0.9); src.stop(t + dur + 0.03);
  },
  play(name, arg){
    log('sound', name, arg === undefined ? '' : arg);
    if (!this.ac || G.save.muted || this.ac.state !== 'running') return;
    const fn = SFX[name]; if (fn) fn(this, this.ac.currentTime + 0.005, arg);
  },
  // с ограничением частоты: не чаще раза в gap реальных секунд; true — сыграл
  playRL(name, gap, arg){ const now = performance.now() / 1000; if ((this.rl[name] || 0) > now) return false; this.rl[name] = now + gap; this.play(name, arg); return true; },
  // мотор жерновов: гул, который набирает обороты под нагрузкой
  motorOn(){
    if (!this.ac || this.motor) return;
    const ac = this.ac, o1 = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o1.type = 'sawtooth'; o1.frequency.value = 46; o2.type = 'square'; o2.frequency.value = 92.5;
    f.type = 'lowpass'; f.frequency.value = 240; f.Q.value = 2; g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g).connect(this.sfx); o1.start(); o2.start();
    this.motor = { o1, o2, f, g }; log('sound', 'motor.on');
  },
  // v6: мотор бензопилы — рычит, пока пила летит; под нагрузкой (внутри фрукта) обороты садятся и звук грубеет
  sawOn(){
    if (!this.ac || this.saw || G.save.muted) return;
    const ac = this.ac, o1 = ac.createOscillator(), o2 = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
    o1.type = 'sawtooth'; o1.frequency.value = 118; o2.type = 'square'; o2.frequency.value = 59; lfo.type = 'square'; lfo.frequency.value = 31; lg.gain.value = 0.35;
    f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 1.4; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + 0.06);
    lfo.connect(lg).connect(g.gain); o1.connect(f); o2.connect(f); f.connect(g).connect(this.sfx); o1.start(); o2.start(); lfo.start();
    this.saw = { o1, o2, lfo, f, g, load: false }; log('sound', 'saw.on');
  },
  sawSet(load){ const m = this.saw; if (!m || m.load === load) return; m.load = load; const t = this.ac.currentTime;
    m.o1.frequency.setTargetAtTime(load ? 74 : 118, t, 0.05); m.o2.frequency.setTargetAtTime(load ? 37 : 59, t, 0.05); m.f.frequency.setTargetAtTime(load ? 520 : 900, t, 0.05);
    m.lfo.frequency.setTargetAtTime(load ? 19 : 31, t, 0.05); log('sound', 'saw.load', load ? 1 : 0); },
  sawOff(){ const m = this.saw; if (!m) return; this.saw = null; const t = this.ac.currentTime;
    m.o1.frequency.setTargetAtTime(40, t, 0.12); m.g.gain.cancelScheduledValues(t); m.g.gain.setTargetAtTime(0.0001, t, 0.09); for (const o of [m.o1, m.o2, m.lfo]) o.stop(t + 0.45); log('sound', 'saw.off'); },
  motorSet(load, on){
    const m = this.motor; if (!m) return;
    const t = this.ac.currentTime, k = on ? load : 0;
    m.g.gain.setTargetAtTime(on ? 0.016 + 0.05 * k : 0, t, 0.08);
    m.o1.frequency.setTargetAtTime(46 + 44 * k, t, 0.12); m.o2.frequency.setTargetAtTime(92.5 + 88 * k, t, 0.12);
    m.f.frequency.setTargetAtTime(240 + 560 * k, t, 0.12);
  },
};
// Синтез событий: имя → функция (S — Sound, t — время AudioContext, a — аргумент). 25 событий + мотор + музыка.
const SFX = {
  aim(S, t){ S.tone(t, 'sine', 2600, 3500, 0.08, 0.04); S.noise(t, 'highpass', 6500, 6500, 0.7, 0.05, 0.025); },                 // нож лёг
  swipe(S, t, len){ const k = Math.min(1, (len || 120) / CFG.bladeMax);                                                             // взмах
    S.noise(t, 'bandpass', 500 + 500 * k, 2600 + 2200 * k, 1.5, 0.15 + 0.09 * k, 0.5); },
  'cut.melon'(S, t){ S.noise(t, 'lowpass', 1500, 450, 1, 0.17, 0.5); S.tone(t, 'sine', 150, 55, 0.15, 0.45);                    // арбуз: низкий влажный хруст
    S.noise(t + 0.025, 'bandpass', 760, 280, 5, 0.13, 0.28); },
  'cut.apple'(S, t){ S.noise(t, 'highpass', 3200, 3200, 0.8, 0.035, 0.22); S.noise(t + 0.01, 'bandpass', 2100, 1200, 3, 0.09, 0.32); // яблоко: щелчок
    S.tone(t, 'triangle', 860, 520, 0.06, 0.12); },
  'cut.citrus'(S, t){ S.noise(t, 'bandpass', 3600, 5600, 1.1, 0.3, 0.28, null, 0.012); S.tone(t, 'sine', 980, 700, 0.05, 0.08); }, // цитрус: «пшик»
  'cut.berry'(S, t){ S.noise(t, 'lowpass', 1300, 520, 2, 0.09, 0.32); S.tone(t, 'sine', 340, 170, 0.09, 0.2); },                 // ягода: чавк
  'cut.cuke'(S, t){ S.noise(t, 'bandpass', 2500, 1600, 2.5, 0.06, 0.42); S.tone(t, 'triangle', 580, 300, 0.07, 0.16); },          // огурец: хрум
  bump(S, t, v){ const k = Math.min(1, (v || VIEW.bumpMin) / 600);                                                                // удар кусков
    S.noise(t, 'lowpass', 420 + 500 * k, 180, 1, 0.07, 0.05 + 0.18 * k); S.tone(t, 'sine', 105 + 50 * k, 55, 0.07, 0.04 + 0.12 * k); },
  grind(S, t){ S.noise(t, 'bandpass', 900, 1600, 3, 0.08, 0.2); S.noise(t + 0.045, 'bandpass', 1400, 700, 3, 0.07, 0.15); },    // хруст в жерновах
  ground(S, t){ S.noise(t, 'lowpass', 1900, 280, 1, 0.22, 0.38); S.tone(t, 'sine', 95, 45, 0.2, 0.3); },                          // кусок перемолот
  pour(S, t, lvl){ const f = 250 + 560 * Math.min(1, lvl || 0); S.tone(t, 'sine', f, f * 1.32, 0.09, 0.16, null, 0.012); },        // бак: тон растёт с соком
  refund(S, t){ [0, 4, 7, 12].forEach((d, i) => S.tone(t + 0.22 + i * 0.07, 'square', midi(79 + d), midi(79 + d), 0.15, 0.06));   // ход вернулся
    S.tone(t + 0.22, 'sine', midi(91), midi(91), 0.5, 0.09); },
  win(S, t){ [0, 4, 7, 12, 16].forEach((d, i) => { S.tone(t + i * 0.09, 'triangle', midi(72 + d), midi(72 + d), 0.34, 0.2);       // победа: фанфара

// Планировщик с упреждением 0,25 с; приглушение (duck) на крупных событиях.
const MUSIC = {
  bpm: 100, vol: 0.12,
  prog: [[53, 57, 60], [50, 53, 57], [46, 50, 53], [48, 52, 55]],
  mel: [72, 0, 69, 0, 67, 69, 0, 0, 65, 0, 67, 0, 69, 0, 72, 0, 74, 0, 72, 0, 69, 67, 0, 0, 67, 0, 69, 0, 72, 0, 0, 0,
        77, 0, 74, 0, 72, 74, 0, 0, 72, 0, 69, 0, 67, 0, 69, 0, 72, 0, 69, 0, 67, 65, 0, 0, 67, 0, 65, 0, 0, 0, 0, 0],
};
const Music = {
  on: false, next: 0, step: 0,
  start(){ if (!Sound.ac || this.on) return; this.on = true; this.next = Sound.ac.currentTime + 0.1; this.step = 0; log('sound', 'music.start'); },
  stop(){ if (!this.on) return; this.on = false; log('sound', 'music.stop'); },
  tick(){
    const ac = Sound.ac; if (!this.on || !ac || G.save.muted || ac.state !== 'running') return;
    const e = 60 / (theme().music || MUSIC).bpm / 2;    // восьмая; темп — от мира
    if (this.next < ac.currentTime) this.next = ac.currentTime + 0.05;   // после паузы вкладки
    while (this.next < ac.currentTime + 0.25){ this.note(this.step, this.next, e); this.step = (this.step + 1) % 64; this.next += e; }
  },
  pluck(m, t, dur, v){ const f = midi(m); Sound.tone(t, 'sine', f, f, dur, v, Sound.mus); Sound.tone(t, 'sine', f * 4, f * 4, dur * 0.22, v * 0.18, Sound.mus); },
  // Оттенок мира (THEMES.music): сдвиг тональности, темп и рисунок баса — 'half' (на 1 и 3), 'walk' (шагом по аккорду),
  // 'reggae' (бас на слабые доли, аккорды «скэнком»).
  note(k, t, e){
    const mu = theme().music || { shift: 0, bass: 'half' }, sh = mu.shift || 0;
    const ch = MUSIC.prog[Math.floor(k / 8) % 4].map(n => n + sh), beat = k % 8, m = MUSIC.mel[k % 64] && MUSIC.mel[k % 64] + sh;
    const bass = (n, d) => Sound.tone(t, 'triangle', midi(n - 12), midi(n - 12), e * d, 0.55, Sound.mus, 0.01);
    if (mu.bass === 'walk'){ if (beat % 2 === 0) bass([ch[0], ch[1], ch[2], ch[1]][beat / 2], 1.6); }
    else if (mu.bass === 'reggae'){ if (beat === 2 || beat === 6) bass(ch[0], 1.4); if (beat === 7) bass(ch[2], 0.8); }
    else if (beat === 0 || beat === 4) bass(ch[0], 1.8);
    if (mu.bass === 'reggae' ? beat === 2 || beat === 6 : beat % 2 === 1) for (const n of ch) this.pluck(n + 12, t, e * 1.5, 0.13);
    if (m) this.pluck(m, t, e * 1.7, 0.3);
    if (beat % 2 === 0) Sound.noise(t, 'highpass', 8000, 8000, 0.7, 0.03, 0.05, Sound.mus);
  },
  duck(depth, dur){
    if (!Sound.mus) return;
    const g = Sound.mus.gain, t = Sound.ac.currentTime, base = MUSIC.vol;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(base * depth, t + 0.05); g.setTargetAtTime(base, t + dur, 0.3);
  },
};
// Вибрация — только после первого жеста (как звук). Android: navigator.vibrate. iOS Safari Vibration API не знает —
// запасной путь: щелчок по скрытому переключателю (input switch) даёт короткий тактильный тик (Safari 17.4+); длительность не задаётся.
let HAP_SW = null;
function hapTick(){
  try {
    if (!HAP_SW){ const l = document.createElement('label'); l.setAttribute('aria-hidden', 'true'); l.style.cssText = 'position:fixed;left:-99px;top:-99px;width:1px;height:1px;overflow:hidden';
      const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i); document.body.appendChild(l); HAP_SW = l; }
    HAP_SW.click();
  } catch (e) {}
}
// raw — длительности как есть; иначе каждая «включённая» часть умножается на VIEW.buzzGain и не короче VIEW.buzzMin:
// импульсы 8–20 мс моторы Android почти не отрабатывают (Xiaomi 15, отзыв Андрея 20.11).
function buzz(ms, raw){ if (!Sound.ac) return;
  try {
    if (!navigator.vibrate){ hapTick(); return; }
    if (!raw && !Array.isArray(ms) && ms <= 20 && G.rt < HAP.until) return;   // короткий щелчок не перебивает идущее мурчание (vibrate заменяет прежний узор)
    const on = (v) => raw ? v : Math.max(VIEW.buzzMin, Math.round(v * VIEW.buzzGain));
    navigator.vibrate(Array.isArray(ms) ? ms.map((v, i) => i % 2 ? v : on(v)) : on(ms));
  } catch (e) {} }
// rumble(k, dur) — продлить «мурчание» на dur секунд с силой k (0…1); сам узор выдаёт rumbleTick раз в цикл, без разрывов.
const HAP = { until: 0, lvl: 0, nextAt: 0 };
function rumble(k, dur){ HAP.until = Math.max(HAP.until, G.rt + dur); HAP.lvl = Math.max(HAP.lvl, Math.min(1, k)); }
function rumbleTick(){
  if (G.rt >= HAP.until){ HAP.lvl = 0; return; }
  if (G.rt < HAP.nextAt) return;
  const on = Math.round(VIEW.rumbleOn[0] + (VIEW.rumbleOn[1] - VIEW.rumbleOn[0]) * HAP.lvl), off = VIEW.rumbleOff;
  buzz([on, off, on, off, on], true); HAP.nextAt = G.rt + (3 * on + 3 * off) / 1000; HAP.lvl *= 0.7;
}

  }
  const t0 = performance.now();
  doCut(...best); frameStep(1 / 60); render(); flush();
  const cutMs = performance.now() - t0, after = [];
  let peakP = 0;
  for (let i = 0; i < 60; i++){ const t1 = performance.now(); frameStep(1 / 60); render(); flush(); after.push(performance.now() - t1); peakP = Math.max(peakP, PT.n); }
  const out = { bodies: n, cssW: Math.round(view.w), cssH: Math.round(view.h), dpr: DPR, canvas: cv.width + '×' + cv.height,
    renderMedian: pct(rt, 0.5), renderP95: pct(rt, 0.95), renderMax: pct(rt, 1), long16: +(rt.filter(v => v > 16.7).length / rt.length).toFixed(3),
    cpuMedian: pct(cpu, 0.5), flushMedian: pct(fl, 0.5),
    cutBodies: bestN, cutFrame: +cutMs.toFixed(2), afterMedian: pct(after, 0.5), afterMax: pct(after, 1), after33: after.filter(v => v > 33).length, peakParticles: peakP };
  log('event', 'bench', JSON.stringify(out));
  return out;
}

// Живой замер не читает холст (getImageData перевёл бы его на CPU) — гонять на свежей странице без ?cpu.
function liveBench(sec){
  const s = benchPile({ level: 23, target: 150 }), iv = [], work = [], cutAt = { i: -1 };
  let last = performance.now(), t0 = last, phase = 0;
  const q = (a, f) => { const b = a.slice().sort((x, y) => x - y); return +b[Math.min(b.length - 1, Math.floor(f * b.length))].toFixed(2); };
  return new Promise((done) => {
    const origTick = tick;
    function f(){
      const now = performance.now(); iv.push(now - last); last = now;
      const w0 = performance.now(); origTick(); work.push(performance.now() - w0);
      if (phase === 0 && now - t0 > sec * 1000){ phase = 1; cutAt.i = iv.length;
        let best = null, bn = -1;
        for (let y = 200; y <= 560; y += 20) for (const a of [0, 0.4, -0.4]){ const L = CFG.bladeMax / 2, line = [200 - Math.cos(a) * L, y - Math.sin(a) * L, 200 + Math.cos(a) * L, y + Math.sin(a) * L];
          const c = previewCut(s, ...line).length; if (c > bn){ bn = c; best = line; } }
        doCut(...best); }
      if (phase === 1 && now - t0 > 2 * sec * 1000){
        const idle = iv.slice(5, cutAt.i), act = iv.slice(cutAt.i), wi = work.slice(5, cutAt.i), wa = work.slice(cutAt.i);
        done({ frames: iv.length, idleIntervalMedian: q(idle, 0.5), idleOver20: idle.filter(v => v > 20).length, idleWorkMedian: q(wi, 0.5),
          actIntervalMedian: q(act, 0.5), actIntervalMax: q(act, 1), actOver33: act.filter(v => v > 33.4).length, actWorkMedian: q(wa, 0.5), actWorkMax: q(wa, 1),
          cutFrameWork: +work[cutAt.i].toFixed(2), cutFrameInterval: +(iv[cutAt.i + 1] || 0).toFixed(2) });
        G.liveBench = false; return; }
      requestAnimationFrame(f);
    }
    G.liveBench = true; requestAnimationFrame(f);
  });
}

// v6: живой замер автоигрой знающего (уровни from…to подряд; после подачи игра сама идёт дальше). Останавливается на уровне за to,
// на проигрыше или по maxSec. → { frames, ivMed, ivMax, over33, workMed, workP95, workMax, per: { уровень: served|lost }, liqMax }.
function liveAuto(from, to, maxSec){
  G.paused = false; setUnlockAll(true); startLevel(from); G.auto = 'know';
  const q = (a, f) => { const b = a.slice().sort((x, y) => x - y); return b.length ? +b[Math.min(b.length - 1, Math.floor(f * b.length))].toFixed(2) : 0; };
  let last = performance.now(); const t0 = last, iv = [], work = [], per = {}, worst = []; let liqMax = 0, ptMax = 0;
  return new Promise((done) => {
    function f(){
      const now = performance.now(); iv.push(now - last); last = now; const w0 = performance.now(); tick(); const wk = performance.now() - w0; work.push(wk);
      if (wk > 12){ const s0 = G.s; worst.push({ ms: +wk.toFixed(1), n: s0 && s0.n, t: s0 && +s0.t.toFixed(2), screen: G.screen, flight: s0 && s0.flight ? s0.flight.w : '', bodies: s0 && s0.bodies.length, intro: G.rt < G.introUntil }); }
      liqMax = Math.max(liqMax, LIQ.n); ptMax = Math.max(ptMax, PT.n);
      const s = G.s; if (s){ if (!per[s.n]) per[s.n] = 'play'; if (s.served || s.won) per[s.n] = 'won'; if (s.lost) per[s.n] = 'lost'; }
      if ((s && s.n > to) || now - t0 > maxSec * 1000 || (s && s.lost && G.screen === 'lose')){
        G.liveBench = false; G.auto = ''; const v = iv.slice(5), w = work.slice(5);
        done({ frames: v.length, sec: +((now - t0) / 1000).toFixed(1), ivMed: q(v, 0.5), ivMax: q(v, 1), over20: v.filter(x => x > 20).length, over33: v.filter(x => x > 33.4).length,
          workMed: q(w, 0.5), workP95: q(w, 0.95), workMax: q(w, 1), per, liqMax, ptMax, worst: worst.slice(0, 12) }); return; }
      requestAnimationFrame(f);
    }
    G.liveBench = true; requestAnimationFrame(f);
  });
}
